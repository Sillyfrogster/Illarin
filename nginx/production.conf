worker_processes auto;
pid /tmp/illarin-nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    # nginx error logs cannot redact request URLs or referrers.
    error_log /dev/null emerg;

    resolver 127.0.0.11 ipv6=off valid=10s;

    map $uri $request_uri_for_log {
        default $uri;
        ~^/connect(?:/|$) /connect;
        ~^/(?:api/)?v1/connect/requests/ /v1/connect/requests/[code-redacted];
        ~^/(?:api/)?v1/connect/authorizations/ /v1/connect/authorizations/[code-redacted];
        ~^/link(?:/|$) /link;
        ~^/(?:api/)?v1/link/requests/ /v1/link/requests/[code-redacted];
        ~^/(?:api/)?v1/link/authorizations/ /v1/link/authorizations/[code-redacted];
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        ~^https$ https;
        ~^http$ http;
    }

    map $http_x_forwarded_for $forwarded_for {
        default $http_x_forwarded_for;
        "" $remote_addr;
    }

    map $forwarded_for $visitor_address {
        default $forwarded_for;
        ~^(?<first>[^,\s]+) $first;
    }

    limit_req_zone $forwarded_for zone=account_auth:10m rate=30r/m;

    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $request_uri_for_log $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" '
                        '$upstream_status $upstream_response_time';
    access_log /dev/stdout redacted;

    server_tokens off;

    server {
        listen 8080;
        server_name ~^(?<legacy_subdomain>[^.]+\.)?illarin\.xyz$;
        return 308 https://${legacy_subdomain}illarin.com$request_uri;
    }

    server {
        listen 8080;
        server_name blog.illarin.xyz;
        return 308 https://illarin.com/blog$request_uri;
    }

    # Umami dashboard only
    server {
        listen 8080;
        server_name ~^analytics\.;
        add_header X-Content-Type-Options nosniff always;

        set $umami_upstream http://umami:3000;

        location / {
            proxy_pass $umami_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header True-Client-IP $visitor_address;
        }
    }

    # Old blog addresses keep working while the blog lives under /blog.
    server {
        listen 8080;
        server_name ~^blog\.(?<site_host>.+)$;
        location = / { return 308 $forwarded_proto://$site_host/blog; }
        location / { return 308 $forwarded_proto://$site_host/blog$request_uri; }
    }

    server {
        listen 8080 default_server;
        client_max_body_size 34m;
        add_header X-Content-Type-Options nosniff always;

        set $api_upstream http://api:8080;
        set $web_upstream http://web:3000;
        set $umami_upstream http://umami:3000;

        location = /gateway-healthz {
            access_log off;
            return 204;
        }

        # Umami tracker and page view collector
        location = /stats/script.js {
            proxy_pass $umami_upstream/script.js;
            proxy_set_header Host $host;
        }

        location = /stats/api/send {
            proxy_pass $umami_upstream/api/send;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header True-Client-IP $visitor_address;
        }

        location /download/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location /send/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        # The old address, kept until the aliases stop on 2026-11-18.
        location /delivery/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location /media/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location = /protocol {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location ~ ^/api/v1/auth/(?:sign-up|sign-in|password-reset(?:/complete)?)$ {
            limit_req zone=account_auth burst=20 nodelay;
            limit_req_status 429;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location = /api/v1/sends/collect {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $api_upstream;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        # The old path, kept until the aliases stop on 2026-11-18.
        location = /api/v1/deliveries/collect {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $api_upstream;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location = /api/v1/library/sync {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }

        location /_illarin/blobs/ {
            internal;
            alias /data/uploads/blobs/;
        }

        location /_illarin/image-cache/ {
            internal;
            alias /data/uploads/image-cache/;
        }

        location / {
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $forwarded_for;
        }
    }
}
