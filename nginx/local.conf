worker_processes 1;
pid /tmp/illarin-nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    # nginx error logs cannot redact request URLs or referrers.
    error_log /dev/null emerg;

    map $uri $request_uri_for_log {
        default $uri;
        ~^/link(?:/|$) /link;
        ~^/(?:api/)?v1/link/requests/ /v1/link/requests/[code-redacted];
        ~^/(?:api/)?v1/link/authorizations/ /v1/link/authorizations/[code-redacted];
    }

    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $request_uri_for_log $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" '
                        '$upstream_status $upstream_response_time';
    access_log /dev/stdout redacted;

    # The site's dev server keeps a websocket open for reloads.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The blog hostname serves blog pages and post media, never the API.
    server {
        listen 127.0.0.1:8000;
        listen [::1]:8000;
        server_name ~^blog\.;
        add_header X-Content-Type-Options nosniff always;

        location /api/ {
            return 404;
        }

        location ~ ^/(?:verify-email|reset-password|(?:api/)?v1/auth/discord/callback)/?$ {
            return 404;
        }

        location /media/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_illarin/blobs/ {
            internal;
            alias api/uploads/blobs/;
        }

        location /_illarin/derivatives/ {
            internal;
            alias api/uploads/derivatives/;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 127.0.0.1:8000 default_server;
        listen [::1]:8000 default_server;
        client_max_body_size 34m;
        add_header X-Content-Type-Options nosniff always;

        location /download/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /delivery/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The API serves its own contract so it matches the build answering.
        location = /openapi.yaml {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /protocol {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/deliveries/collect {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://127.0.0.1:8080;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location = /api/v1/library/sync {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /_illarin/blobs/ {
            internal;
            alias api/uploads/blobs/;
        }

        location /_illarin/derivatives/ {
            internal;
            alias api/uploads/derivatives/;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
