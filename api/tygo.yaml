# tygo reads the request and response structs in the files listed below and
# writes them as TypeScript to web/src/lib/api/shapes.ts and one file per
# feature package under web/src/lib/api/shapes/, all of which git ignores.
# shapes.ts re-exports the feature files, so the site imports from one place.
# Run it from the api directory with make site-types.
packages:
  - path: "github.com/Sillyfrogster/Illarin/api/internal/account"
    output_path: "../web/src/lib/api/shapes/account.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      uuid.UUID: "string"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/profile"
    output_path: "../web/src/lib/api/shapes/profile.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      uuid.UUID: "string"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/notify"
    output_path: "../web/src/lib/api/shapes/notify.ts"
    enum_style: "union"
    preserve_comments: "none"
    include_files:
      - "watch_shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/work"
    output_path: "../web/src/lib/api/shapes/work.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { AssetWatch } from "./notify";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      json.RawMessage: "unknown"
      notify.AssetWatch: "AssetWatch"
    include_files:
      - "blocks_shapes.go"
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/http"
    output_path: "../web/src/lib/api/shapes.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { AssetWatch } from "./shapes/notify";
      import type { ProfileAvatar } from "./shapes/profile";
      import type {
        AppTarget,
        AssetBlock,
        AssetImage,
        ColorSetContent,
        DialogueSampleContent,
        DownloadTarget,
        ElementType,
        EntryTableContent,
        FieldListContent,
        ImageSetContent,
        ItemSize,
        LinkListContent,
        PromptListContent,
        ProseContent,
        RecordedVersion,
        RecordListContent,
        ScriptListContent,
        SettingGroupContent,
        StylesheetSetContent,
        TextSetContent,
        VariableSchemaContent,
      } from "./shapes/work";

      export * from "./shapes/account";
      export * from "./shapes/notify";
      export * from "./shapes/profile";
      export * from "./shapes/work";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      json.RawMessage: "unknown"
      notify.AssetWatch: "AssetWatch"
      profile.ProfileAvatar: "ProfileAvatar"
      work.AppTarget: "AppTarget"
      work.AssetBlock: "AssetBlock"
      work.AssetImage: "AssetImage"
      work.DownloadTarget: "DownloadTarget"
      work.ElementType: "ElementType"
      work.ItemSize: "ItemSize"
      work.RecordedVersion: "RecordedVersion"
    include_files:
      - "asset_destination_shapes.go"
      - "asset_shapes.go"
      - "block_arrangement_shapes.go"
      - "block_save_shapes.go"
      - "delivery_shapes.go"
      - "destination_shapes.go"
      - "download_shapes.go"
      - "from_nothing_shapes.go"
      - "history_shapes.go"
      - "lifecycle_shapes.go"
      - "linking_shapes.go"
      - "notification_shapes.go"
      - "post_deletion_shapes.go"
      - "post_history_shapes.go"
      - "post_import_shapes.go"
      - "post_refusal_shapes.go"
      - "post_schedule_shapes.go"
      - "post_shapes.go"
      - "post_withdrawal_shapes.go"
      - "preserved_shapes.go"
      - "publication_shapes.go"
      - "restriction_shapes.go"
      - "upload_helpers_shapes.go"
      - "vault_shapes.go"
