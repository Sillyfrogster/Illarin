# tygo reads the request and response structs in the files listed below and
# writes them as TypeScript to web/src/lib/api/shapes.ts and one file per
# feature package under web/src/lib/api/shapes/, all of which git ignores.
# shapes.ts re-exports the feature files, so the site imports from one place;
# the image package writes it, so its own shapes sit there rather than beside it.
# Run it from the api directory with make site-types.
packages:
  - path: "github.com/Sillyfrogster/Illarin/api/internal/account"
    output_path: "../web/src/lib/api/shapes/account.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      uuid.UUID: "string"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/profile"
    output_path: "../web/src/lib/api/shapes/profile.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { BrowseWork } from "./work";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      page.BrowseWork: "BrowseWork"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/notify"
    output_path: "../web/src/lib/api/shapes/notify.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
    include_files:
      - "inbox_shapes.go"
      - "follow_shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/block"
    output_path: "../web/src/lib/api/shapes/block.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      uuid.UUID: "string"
      json.RawMessage: "unknown"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/block/edit"
    output_path: "../web/src/lib/api/shapes/edit.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type {
        WorkElementItemSize,
        ColorSetContent,
        DialogueSampleContent,
        ElementType,
        EntryTableContent,
        FieldListContent,
        ImageSetContent,
        LinkListContent,
        PromptListContent,
        ProseContent,
        RecordListContent,
        ScriptListContent,
        SettingGroupContent,
        StylesheetSetContent,
        TextSetContent,
        VariableSchemaContent,
      } from "./block";
    type_mappings:
      uuid.UUID: "string"
      json.RawMessage: "unknown"
      block.WorkElementItemSize: "WorkElementItemSize"
      block.ElementType: "ElementType"
    include_files:
      - "save_shapes.go"
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/page"
    output_path: "../web/src/lib/api/shapes/work.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { WorkBlock, ElementType } from "./block";
      import type { WorkFollow } from "./notify";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      json.RawMessage: "unknown"
      block.WorkBlock: "WorkBlock"
      block.ElementType: "ElementType"
      notify.WorkFollow: "WorkFollow"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/version"
    output_path: "../web/src/lib/api/shapes/version.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { RecordedVersion } from "./work";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      page.RecordedVersion: "RecordedVersion"
    include_files:
      - "publish_shapes.go"
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/upload"
    output_path: "../web/src/lib/api/shapes/upload.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { WorkBlock } from "./block";
      import type { VersionChangeGroup } from "./version";
      import type { AppName } from "./work";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      version.VersionChangeGroup: "VersionChangeGroup"
      page.AppName: "AppName"
      block.WorkBlock: "WorkBlock"
    include_files:
      - "shapes.go"
      - "start_shapes.go"
      - "shelf_shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/download"
    output_path: "../web/src/lib/api/shapes/download.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { WorkBlock } from "./block";
      import type {
        AppFormat,
        AppName,
        WorkImage,
        DownloadFormat,
        RecordedVersion,
      } from "./work";
    type_mappings:
      uuid.UUID: "string"
      block.WorkBlock: "WorkBlock"
      block.Role: "string"
      page.AppFormat: "AppFormat"
      page.AppName: "AppName"
      page.WorkImage: "WorkImage"
      page.DownloadFormat: "DownloadFormat"
      page.RecordedVersion: "RecordedVersion"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/connect"
    output_path: "../web/src/lib/api/shapes/connect.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
    include_files:
      - "connection_shapes.go"
      - "send_shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/integration"
    output_path: "../web/src/lib/api/shapes/integration.ts"
    enum_style: "union"
    preserve_comments: "none"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/blog"
    output_path: "../web/src/lib/api/shapes/blog.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      export type { PostResponse as Post };
      export type { PostImportResponse as PostImport };
      export type { PostMediaResponse as PostMedia };
      export type { PostSummaryResponse as PostSummary };
      export type { PublicPostResponse as PublicPost };
      import type { ProfilePicture } from "./profile";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      json.RawMessage: "unknown"
      profile.ProfilePicture: "ProfilePicture"
    include_files:
      - "post_deletion_handlers.go"
      - "post_history_handlers.go"
      - "post_import_handlers.go"
      - "post_schedule_handlers.go"
      - "post_handlers.go"
      - "post_unpublish_handlers.go"
      - "writer_handlers.go"
      - "handlers.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/staff"
    output_path: "../web/src/lib/api/shapes/staff.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      time.Time: "string"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/image"
    output_path: "../web/src/lib/api/shapes.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      export * from "./shapes/account";
      export * from "./shapes/block";
      export * from "./shapes/blog";
      export * from "./shapes/connect";
      export * from "./shapes/download";
      export * from "./shapes/edit";
      export * from "./shapes/integration";
      export * from "./shapes/notify";
      export * from "./shapes/profile";
      export * from "./shapes/staff";
      export * from "./shapes/upload";
      export * from "./shapes/version";
      export * from "./shapes/work";
    type_mappings:
      uuid.UUID: "string"
    include_files:
      - "form.go"
      - "shapes.go"
