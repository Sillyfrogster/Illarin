# tygo reads the request and response structs in the files listed below and
# writes them as TypeScript to web/src/lib/api/shapes.ts and one file per
# feature package under web/src/lib/api/shapes/, all of which git ignores.
# shapes.ts re-exports the feature files, so the site imports from one place.
# Run it from the api directory with make site-types.
packages:
  - path: "github.com/Sillyfrogster/Illarin/api/internal/account"
    output_path: "../web/src/lib/api/shapes/account.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      uuid.UUID: "string"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/profile"
    output_path: "../web/src/lib/api/shapes/profile.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      uuid.UUID: "string"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/notify"
    output_path: "../web/src/lib/api/shapes/notify.ts"
    enum_style: "union"
    preserve_comments: "none"
    include_files:
      - "watch_shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/block"
    output_path: "../web/src/lib/api/shapes/block.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      uuid.UUID: "string"
      json.RawMessage: "unknown"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/block/edit"
    output_path: "../web/src/lib/api/shapes/edit.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type {
        AssetElementItemSize,
        ColorSetContent,
        DialogueSampleContent,
        ElementType,
        EntryTableContent,
        FieldListContent,
        ImageSetContent,
        LinkListContent,
        PromptListContent,
        ProseContent,
        RecordListContent,
        ScriptListContent,
        SettingGroupContent,
        StylesheetSetContent,
        TextSetContent,
        VariableSchemaContent,
      } from "./block";
    type_mappings:
      uuid.UUID: "string"
      json.RawMessage: "unknown"
      block.AssetElementItemSize: "AssetElementItemSize"
      block.ElementType: "ElementType"
    include_files:
      - "save_shapes.go"
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/work"
    output_path: "../web/src/lib/api/shapes/work.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { AssetBlock, ElementType } from "./block";
      import type { AssetWatch } from "./notify";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      json.RawMessage: "unknown"
      block.AssetBlock: "AssetBlock"
      block.ElementType: "ElementType"
      notify.AssetWatch: "AssetWatch"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/version"
    output_path: "../web/src/lib/api/shapes/version.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { RecordedVersion } from "./work";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      work.RecordedVersion: "RecordedVersion"
    include_files:
      - "publish_shapes.go"
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/upload"
    output_path: "../web/src/lib/api/shapes/upload.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { VersionChangeGroup } from "./version";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      version.VersionChangeGroup: "VersionChangeGroup"
    include_files:
      - "shapes.go"
      - "start_shapes.go"
      - "vault_shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/download"
    output_path: "../web/src/lib/api/shapes/download.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { AssetBlock } from "./block";
      import type {
        AppTarget,
        AssetImage,
        DownloadTarget,
        RecordedVersion,
      } from "./work";
    type_mappings:
      uuid.UUID: "string"
      block.AssetBlock: "AssetBlock"
      work.AppTarget: "AppTarget"
      work.AssetImage: "AssetImage"
      work.DownloadTarget: "DownloadTarget"
      work.RecordedVersion: "RecordedVersion"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/connect"
    output_path: "../web/src/lib/api/shapes/connect.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
    include_files:
      - "link_shapes.go"
      - "send_shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/integration"
    output_path: "../web/src/lib/api/shapes/integration.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { PublicationDestinationChoice as AnnouncementPublicationDestinationChoice } from "./announcements";
      import type { PublicationDestinationKind as AnnouncementPublicationDestinationKind } from "./announcements";
      import type { PublicationDestinationState as AnnouncementPublicationDestinationState } from "./announcements";
      import type { PublicationEvent as AnnouncementPublicationEvent } from "./announcements";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      announcements.PublicationDestinationChoice: "AnnouncementPublicationDestinationChoice"
      announcements.PublicationDestinationKind: "AnnouncementPublicationDestinationKind"
      announcements.PublicationDestinationState: "AnnouncementPublicationDestinationState"
      announcements.PublicationEvent: "AnnouncementPublicationEvent"
    include_files:
      - "asset_destination_shapes.go"
      - "destination_shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/integration/blog"
    output_path: "../web/src/lib/api/shapes/announcements.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      uuid.UUID: "string"
    include_files:
      - "choice_shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/blog"
    output_path: "../web/src/lib/api/shapes/blog.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      export type { PostResponse as Post };
      export type { PostImportResponse as PostImport };
      export type { PostMediaResponse as PostMedia };
      export type { PostSummaryResponse as PostSummary };
      export type { PublicPostResponse as PublicPost };
      import type { ProfileAvatar } from "./profile";
      import type { PublicationDestinationChoice } from "./integration";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      json.RawMessage: "unknown"
      profile.ProfileAvatar: "ProfileAvatar"
      announcements.PublicationDestinationChoice: "PublicationDestinationChoice"
    include_files:
      - "post_deletion_handlers.go"
      - "post_history_handlers.go"
      - "post_import_handlers.go"
      - "post_schedule_handlers.go"
      - "post_handlers.go"
      - "post_withdrawal_handlers.go"
      - "publication_handlers.go"
      - "handlers.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/staff"
    output_path: "../web/src/lib/api/shapes/staff.ts"
    enum_style: "union"
    preserve_comments: "none"
    type_mappings:
      time.Time: "string"
    include_files:
      - "shapes.go"
  - path: "github.com/Sillyfrogster/Illarin/api/internal/http"
    output_path: "../web/src/lib/api/shapes.ts"
    enum_style: "union"
    preserve_comments: "none"
    frontmatter: |
      import type { AssetWatch } from "./shapes/notify";

      export * from "./shapes/account";
      export * from "./shapes/block";
      export * from "./shapes/blog";
      export * from "./shapes/connect";
      export * from "./shapes/download";
      export * from "./shapes/edit";
      export * from "./shapes/integration";
      export * from "./shapes/notify";
      export * from "./shapes/profile";
      export * from "./shapes/staff";
      export * from "./shapes/upload";
      export * from "./shapes/version";
      export * from "./shapes/work";
    type_mappings:
      time.Time: "string"
      uuid.UUID: "string"
      json.RawMessage: "unknown"
      notify.AssetWatch: "AssetWatch"
    include_files:
      - "asset_shapes.go"
      - "notification_shapes.go"
      - "preserved_shapes.go"
      - "upload_helpers_shapes.go"
