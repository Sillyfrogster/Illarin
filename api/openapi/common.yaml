components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: illarin_session
    browserMutation:
      type: apiKey
      in: header
      name: X-Illarin-Request
      description: >-
        Required with the session cookie on state-changing browser requests.
        The value must be 1 and the Origin must be Illarin's browser origin.
    instanceToken:
      type: http
      scheme: bearer
      description: A short-lived access token issued to one linked instance.
    publicationToken:
      type: http
      scheme: bearer
      description: >-
        A publication token issued under one publication grant. It is not a
        session, it is not an instance token, and it carries no authority
        outside the publication it was issued for.
  parameters:
    IllarinRequest:
      name: X-Illarin-Request
      in: header
      required: true
      description: Illarin's browser request proof. The value must be 1.
      schema:
        type: string
        enum:
          - '1'
