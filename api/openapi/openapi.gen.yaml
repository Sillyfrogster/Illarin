          application/json:
            schema:
              $ref: '#/components/schemas/PostVersionRequest'
      responses:
        '200':
          description: The working copy the edition was copied into
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/PublicationUnauthenticated'
        '403':
          $ref: '#/components/responses/PublicationForbidden'
        '404':
          $ref: '#/components/responses/PublicationNotFound'
        '409':
          description: The working copy moved on, or the key was reused for another request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
  /v1/publication/destinations:
    get:
      operationId: listPublicationDestinations
      description: >-
        Every configured destination, masked. Only the publication authority may
        read it, and even it cannot read back an endpoint address or a signing
        secret.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The configured destinations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestinationList'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
    post:
      operationId: addPublicationDestination
      description: >-
        Configure one endpoint. The response is the only time Illarin can show
        its signing secret, and the endpoint receives nothing until it has
        answered a verification challenge.
      security:
        - sessionCookie: []
          browserMutation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPublicationDestinationRequest'
      responses:
        '201':
          description: The destination and its signing secret, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddedPublicationDestination'
        '400':
          $ref: '#/components/responses/PublicationInvalid'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
  /v1/publication/destinations/{id}:
    patch:
      operationId: updatePublicationDestination
      description: >-
        Rename a destination or point it somewhere else. A new address takes it
        back to unverified, because control of the old one proves nothing about
        the new one.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicationDestinationRequest'
      responses:
        '200':
          description: The destination as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestination'
        '400':
          $ref: '#/components/responses/PublicationInvalid'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
    delete:
      operationId: removePublicationDestination
      description: >-
        Take a destination out of the configuration. Every delivery it already
        holds keeps the name it was sent under.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The destination is gone
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
  /v1/publication/destinations/{id}/verification:
    post:
      operationId: verifyPublicationDestination
      description: >-
        Send one signed challenge and activate the destination only when the
        exact value comes back.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The destination, now active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestination'
        '400':
          $ref: '#/components/responses/PublicationInvalid'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
    delete:
      operationId: disablePublicationDestination
      description: >-
        Stop a destination receiving anything further. What it has already
        received stays where it is.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The destination, now disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestination'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
  /v1/publication/destinations/{id}/secret:
    post:
      operationId: rotatePublicationDestinationSecret
      description: >-
        Draw a new signing secret. The old one keeps producing an accepted
        signature for a bounded overlap, so a receiver changes over without
        dropping an event, and is then forgotten.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The new signing secret, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedPublicationSecret'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
  /v1/publication/deliveries:
