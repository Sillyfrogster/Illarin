        '403':
          $ref: '#/components/responses/PublicationForbidden'
        '404':
          $ref: '#/components/responses/PublicationNotFound'
        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
    post:
      operationId: checkpointPost
      description: >-
        Keep the named working copy as an immutable edition. Readers see nothing
        new, and the working copy carries on unchanged.
      security:
        - sessionCookie: []
          browserMutation: []
        - publicationToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
