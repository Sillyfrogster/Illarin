        - assetId
        - state
        - queuedAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - queued
            - released
            - failed
        reason:
          type:
            - string
            - 'null'
          enum:
            - withdrawn
            - unsupported
            - abandoned
            - null
          description: Why a failed delivery stopped.
        queuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    AssetInstance:
      type: object
      additionalProperties: false
      required:
        - instanceId
        - applicationName
        - instanceName
        - lastSeenAt
        - canReceive
        - reportsLibrary
        - delivery
        - installedGeneration
        - updateAvailable
      properties:
        instanceId:
          type: string
          format: uuid
        applicationName:
          type: string
        instanceName:
          type: string
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
        canReceive:
          type: boolean
        reportsLibrary:
          type: boolean
        delivery:
          oneOf:
            - $ref: '#/components/schemas/QueuedDelivery'
            - type: 'null'
        installedGeneration:
          type:
            - integer
            - 'null'
        updateAvailable:
          type: boolean
    AssetInstanceList:
      type: object
      additionalProperties: false
      required:
        - contentGeneration
        - items
      properties:
        contentGeneration:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetInstance'
    SendAssetRequest:
      type: object
      additionalProperties: false
      required:
        - instanceId
      properties:
        instanceId:
          type: string
          format: uuid
    PublicationDestinationState:
      type: string
