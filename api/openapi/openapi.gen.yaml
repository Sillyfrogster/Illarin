        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVersionRequest'
      responses:
        '200':
          description: The post, back in the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PublicationInvalid'
        '401':
          $ref: '#/components/responses/PublicationUnauthenticated'
        '403':
          $ref: '#/components/responses/PublicationForbidden'
        '404':
          $ref: '#/components/responses/PublicationNotFound'
        '409':
          description: The working copy moved on, or the key was reused for another request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
  /v1/publication/posts/{id}/schedule:
    post:
      operationId: schedulePost
      description: >-
        Capture the named working copy as an immutable revision and set it to go
        live at one instant. Editing the working copy afterwards does not reach
        the edition that will publish.
      security:
        - sessionCookie: []
          browserMutation: []
        - publicationToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePostRequest'
      responses:
        '201':
          description: The post with the edition it will publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PublicationInvalid'
        '401':
          $ref: '#/components/responses/PublicationUnauthenticated'
        '403':
          $ref: '#/components/responses/PublicationForbidden'
        '404':
          $ref: '#/components/responses/PublicationNotFound'
        '409':
          description: >-
            The working copy moved on, the post is already scheduled, or the key
            was reused for another request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
    put:
      operationId: replacePostSchedule
      description: >-
        Point a waiting schedule at another edition the post has already kept,
        at the same instant or a new one. The edition it leaves is untouched.
      security:
        - sessionCookie: []
          browserMutation: []
        - publicationToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePostScheduleRequest'
      responses:
        '200':
          description: The post with the edition it will now publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PublicationInvalid'
        '401':
          $ref: '#/components/responses/PublicationUnauthenticated'
        '403':
          $ref: '#/components/responses/PublicationForbidden'
        '404':
          $ref: '#/components/responses/PublicationNotFound'
        '409':
          description: The schedule is already publishing, or the key was reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
    delete:
      operationId: cancelPostSchedule
      description: >-
        Stop a waiting schedule. The post keeps whatever it shows readers now,
        and the edition the schedule named stays in its history.
      security:
        - sessionCookie: []
          browserMutation: []
        - publicationToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The post with nothing waiting to publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/PublicationUnauthenticated'
        '403':
          $ref: '#/components/responses/PublicationForbidden'
        '404':
          $ref: '#/components/responses/PublicationNotFound'
        '409':
          description: The schedule is already publishing, or the key was reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
  /v1/publication/posts/{id}/address:
    put:
      operationId: correctPostAddress
      description: >-
        Move a published post to a corrected permalink. The address it leaves
        keeps pointing at the post and can never belong to another one.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectPostAddressRequest'
      responses:
        '200':
          description: The post at its corrected address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: The address is reserved, taken or the post is not published
        '401':
          description: No account is signed in
        '403':
          description: Only an Illarin admin may correct a published post
        '404':
          description: No such post
  /v1/publication/posts/{id}/byline:
    put:
      operationId: correctPostByline
      description: >-
        Replace the attribution a published post carries with a fresh snapshot
        of another account's public identity. The author, grant and captured
        revisions are unchanged.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectPostBylineRequest'
      responses:
        '200':
          description: The post carrying its corrected byline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: The post is not published
        '401':
          description: No account is signed in
        '403':
          description: Only an Illarin admin may correct a published post
        '404':
          description: No such post or account
  /v1/post-categories:
    get:
      operationId: listPostCategories
      description: >-
        The publication categories that carry published posts, in the order the
        publication shows them. A category nobody has published in is absent, so
        every category the blog offers leads to writing.
      responses:
        '200':
          description: The categories a reader can browse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationCategoryList'
  /v1/post-apps:
    get:
      operationId: listPostApps
      description: >-
        The publication apps that carry published posts, in the order the
        publication shows them. An app nobody has published for is absent, so
        every app archive the blog offers leads to writing.
      responses:
        '200':
          description: The apps a reader can browse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationAppList'
  /v1/posts:
    get:
      operationId: listPublishedPosts
      description: >-
        One page of the published archive, newest first. A category or app slug
        narrows the same chronology. Drafts, working copies, editions held for a
        later instant and posts out of public view are absent from it.
      parameters:
        - name: page
          in: query
          description: The archive page to read, counting from one.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: category
          in: query
          description: A publication category slug the archive is narrowed to.
          schema:
            type: string
        - name: app
          in: query
          description: A publication app slug the archive is narrowed to.
          schema:
            type: string
      responses:
        '200':
          description: The page of posts and the scope it was read under
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostArchive'
        '404':
          description: No such publication category or app
  /v1/posts/{slug}:
    get:
      operationId: getPublishedPost
      description: >-
        The published edition behind one post address. Drafts and working copies
        are absent from it.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The published post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPost'
        '404':
          description: No published post has that address
        '410':
          description: The post at that address was withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawnPost'
  /v1/profiles/{handle}:
    get:
      operationId: getProfile
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The active public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: No active profile uses the handle
  /v1/profiles/{handle}/restriction:
    get:
      operationId: getProfileRestriction
      description: >-
        The private reason a profile is restricted. Only an admin may read it,
        and it never reaches a public or owner response.
      security:
        - sessionCookie: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The restriction now in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileRestriction'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not an admin
        '404':
          description: No such account, or its profile is not restricted
    put:
      operationId: restrictProfile
      description: >-
        Hides the added identity on one public profile until an admin restores
        it. It changes no role, credential, asset or ownership.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestrictProfileRequest'
      responses:
        '200':
          description: The restriction now in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileRestriction'
        '400':
          description: The audit reason is missing or too long
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not an admin
        '404':
          description: No such account
    delete:
      operationId: restoreProfile
      description: Gives a restricted profile its retained fields back.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The profile is restored
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not an admin
        '404':
          description: No such account, or its profile is not restricted
  /v1/legacy-profiles/{discordId}:
    get:
      operationId: resolveLegacyProfile
      description: >-
        Resolves v1's /user/<discordId> address through the Discord identity
        link. The lookup happens before any redirect, so an address with no
        account behind it is a plain miss.
      parameters:
        - name: discordId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The profile the Discord identity belongs to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: No account carries that Discord identity
  /v1/assets:
    get:
      operationId: listAssets
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - character
              - lorebook
              - preset
              - theme
              - pack
        - name: platform
          in: query
          description: >-
            An app, from the platforms list. An app matches an asset when any of
            the asset's offered download formats is one that app reads.
          schema:
            type: string
        - name: creator
          in: query
          description: Scope the listing to one creator's public profile.
          schema:
            type: string
        - name: q
          in: query
          description: >-
            One search expression. Bare text matches names, creator handles and
            blurbs. Repeat tag: to require every tag; one author: qualifier may
            narrow the creator. Quote qualifier values that contain spaces.
          schema:
            type: string
        - name: facet
          in: query
          description: >-
            Repeat key=value, taking the keys and values from the facets list.
            Two values of one key widen the result; two keys narrow it. A key or
            value the kind does not declare is ignored.
          schema:
            type: array
            items:
              type: string
        - name: nsfw
          in: query
          description: >-
            The reader's presentation preference. Browse page URLs keep this
            preference out of their own query string.
          schema:
            type: string
            enum:
              - hidden
              - blurred
              - shown
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
        - name: before
          in: query
          description: >-
            The made date of the last asset on the previous page. Send it with
            beforeId or not at all.
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          description: The id of that same asset
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assets a visitor may see
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
    post:
      operationId: createAsset
      security:
        - sessionCookie: []
          browserMutation: []
      description: >-
        Two ways to make an asset. Send form data to bring a file in, or send
        JSON naming a kind to start from nothing. The kind is asked for once,
        before any blocks exist, and never changes afterwards.
      requestBody:
        required: true
        description: >-
          Send the metadata part before the file part. The file is read as it
          arrives, so the catalog fields have to be known by then.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
                - file
              properties:
                metadata:
                  $ref: '#/components/schemas/CreateAssetRequest'
                file:
                  type: string
                  format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/StartAssetRequest'
      responses:
        '201':
          description: The draft that was started, with the blocks its kind requires
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '202':
          description: The durable ingest operation for the accepted upload
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestOperation'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '413':
          description: The file exceeds an upload limit or the account storage cap
        '422':
          description: The uploaded bytes have been purged and cannot return
        '503':
          description: The storage reserve cannot accept the upload
  /v1/assets/{id}:
    get:
      operationId: getAsset
      description: >-
        One asset by id. Unlisted assets answer normally, because unlisted is
        discovery rather than authorization. Withheld, deleted and never-existed
        all answer 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nsfw
          in: query
          description: >-
            The reader's presentation preference. Asset page URLs keep this
            preference out of their own query string.
          schema:
            type: string
            enum:
              - hidden
              - blurred
              - shown
      responses:
        '200':
          description: The asset as a visitor may see it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '404':
          description: No asset a visitor may see
    delete:
      operationId: deleteAsset
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The asset is recoverable from the creator's Deleted section
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The asset does not belong to the creator
        '409':
          description: The asset is withheld and cannot be deleted
  /v1/legacy-assets/{author}/{name}:
    get:
      operationId: resolveLegacyAsset
      description: >-
        The asset that answered for a v1 public address. The lookup applies the
        same access rules the permalink does, so a withheld, deleted or
        never-existed address answers 404 with nothing that says which.
      parameters:
        - name: author
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The asset the address belongs to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyAsset'
        '404':
          description: No asset a visitor may see
  /v1/assets/{id}/revisions:
    post:
      operationId: addAssetRevision
      description: >-
        Replace an asset's source bytes. A revision is the file only: name,
        blurb, tags and the NSFW flag stay as the creator left them. A file that
        reads as a different kind is refused and the asset is left untouched.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: The durable ingest operation for the accepted revision
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestOperation'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The asset does not belong to the creator
        '409':
          description: The asset is withheld and cannot be changed
        '413':
          description: The file exceeds an upload limit or the account storage cap
        '503':
          description: The storage reserve cannot accept the revision
  /v1/assets/{id}/blocks/{blockId}:
    put:
      operationId: saveAssetBlock
      description: >-
        Save one block without rewriting any other block on the asset. Draft
        content may be empty, but it must still be structurally valid and obey
        the kind catalog's builder constraints.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: blockId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAssetBlockRequest'
      responses:
        '200':
          description: The saved block as it now appears on the page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetBlock'
        '400':
          description: The block is malformed or breaks a builder constraint
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The asset or block does not belong to the creator
        '409':
          description: The asset is withheld and cannot be changed
        '422':
          description: The uploaded bytes have been purged and cannot return
    delete:
      operationId: removeAssetBlock
      description: >-
        Remove one optional block and its elements. Required blocks are refused.
