    PublicationErrorCode:
      type: string
      description: >-
        The stable name of a refusal. A client reads this rather than the
        sentence beside it, which is written for a person and may change.
      enum:
        - unauthenticated
        - token_expired
        - token_revoked
        - grant_revoked
        - forbidden
        - not_found
        - invalid
        - category_refused
        - stale_version
        - already_scheduled
        - schedule_running
        - idempotency_mismatch
        - idempotency_in_progress
        - rate_limited
        - server_error
      x-enum-varnames:
        - CodeUnauthenticated
        - CodeTokenExpired
        - CodeTokenRevoked
        - CodeGrantRevoked
        - CodeForbidden
        - CodeNotFound
        - CodeInvalid
        - CodeCategoryRefused
        - CodeStaleVersion
        - CodeAlreadyScheduled
        - CodeScheduleRunning
        - CodeIdempotencyMismatch
        - CodeIdempotencyInProgress
        - CodeRateLimited
        - CodeServerError
    PublicationError:
      type: object
      description: >-
        How every publication route refuses. It never names another account,
        grant or token.
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          $ref: '#/components/schemas/PublicationErrorCode'
        field:
          type: string
          description: The request field the refusal is about, where there is one.
