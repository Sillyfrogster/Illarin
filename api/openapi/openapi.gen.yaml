  /v1/publication/posts:
    get:
      operationId: listPosts
      description: >-
        Every post this credential may manage. An admin sees all of them, an
        approved contributor sees the posts under their active grants, and a
        publication token sees only the posts under the one grant it was issued
        for. Deleted posts are left out unless they are the ones asked for.
      security:
        - sessionCookie: []
        - publicationToken: []
      parameters:
        - name: deleted
          in: query
          required: false
          description: >-
            Ask for the deleted posts still inside their recovery window instead
            of the active ones.
          schema:
            type: boolean
      responses:
        '200':
          description: The posts this account may manage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
        '401':
          $ref: '#/components/responses/PublicationUnauthenticated'
        '403':
          $ref: '#/components/responses/PublicationForbidden'
        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
    post:
      operationId: createPost
      description: >-
        Start a draft. A contributor names the grant it belongs to and an admin
        may omit it and write as Illarin. A publication token writes under its
        own grant and may not name another.
      security:
        - sessionCookie: []
          browserMutation: []
        - publicationToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: The draft as it was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PublicationInvalid'
        '401':
          $ref: '#/components/responses/PublicationUnauthenticated'
        '403':
          $ref: '#/components/responses/PublicationForbidden'
        '404':
          $ref: '#/components/responses/PublicationNotFound'
        '409':
          description: The working copy moved on, or the key was reused for another request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
