            format: uuid
      responses:
        '200':
          description: Every namespace the asset carries, in name order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreservedNamespace'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The asset does not belong to the creator
  /v1/assets/{id}/preserved/{namespace}:
    delete:
      operationId: deletePreservedNamespace
      description: >-
        Delete one namespace and everything stored under it. Deletion is
        permanent: the lossless rule binds Illarin, not the creator.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: namespace
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The namespace is gone
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The asset or the namespace does not belong to the creator
        '409':
          description: The asset is withheld and cannot be changed
  /v1/assets/{id}/sealed:
    get:
      operationId: exportSealedContent
      description: >-
        Hand the owner the content their v1 preset kept sealed, as one file.
        Illarin has no mechanism that resolves sealed blocks and does not grow
        one here; the export exists so the preserved set is live data rather
        than a backup nobody has ever opened. Deny by default: anyone but the
        owner, and any asset holding nothing sealed, gets 404.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Every sealed block the asset preserves, in version and key order
          content:
            application/json:
              schema:
                type: string
                format: binary
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The asset holds no sealed content for this creator
  /v1/assets/{id}/restore:
    post:
      operationId: restoreAsset
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The existing asset and retained bytes are live again
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: No recoverable asset belongs to the creator
  /v1/assets/{id}/identity:
    put:
      operationId: setAssetIdentity
      description: >-
        Save the header fields that sit above an asset's blocks. The adult
        content answer may be null only while the asset is a draft, so nothing
        answers it on the creator's behalf. An edit is live when it saves.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetIdentityRequest'
      responses:
        '204':
          description: The header is saved
        '400':
          description: The name is too long
          or a published asset was sent no adult content answer: null
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The asset does not belong to the creator
        '409':
          description: The asset is withheld and cannot be changed
  /v1/assets/{id}/publish:
    post:
      operationId: publishAsset
      description: >-
        Publish a draft. Publishing is one-way: unlisted is the reversible
        retreat and deletion is the exit. A draft that does not meet the floor
        is refused with the whole readiness list rather than the first thing
        missing.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The asset as its page now reads, published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The draft does not belong to the creator
        '409':
          description: >-
            The draft is not ready, the asset is already published, or it is
            withheld
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishRefusal'
  /v1/assets/{id}/discovery:
    put:
      operationId: setAssetDiscovery
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetDiscoveryRequest'
      responses:
        '204':
          description: The asset discovery state is saved
        '400':
          description: The discovery value is invalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The asset does not belong to the creator
        '409':
          description: The asset is withheld and cannot be changed
  /v1/profiles/{handle}/deleted:
    get:
      operationId: listDeletedAssets
      security:
        - sessionCookie: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The signed-in creator's assets still inside the recovery window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedAssetList'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
  /v1/assets/{id}/withhold:
    put:
      operationId: withholdAsset
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithholdAssetRequest'
      responses:
        '204':
          description: The asset is withheld
        '400':
          description: The reason is empty or invalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not an admin
        '404':
          description: No live asset has that id
    delete:
      operationId: clearAssetWithhold
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The asset is no longer withheld
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not an admin
        '404':
          description: No withheld asset has that id
  /download/{id}:
    get:
      operationId: downloadSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current uploaded source file, byte for byte
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
                enum:
                  - attachment
                  - inline
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                enum:
                  - nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '404':
          description: No such asset
  /download/{id}/{target}:
    get:
      operationId: downloadExport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: target
          in: path
          required: true
          description: >-
            One of the formats the asset is offered in. A format outside that
            list was never a choice and is refused.
          schema:
            type: string
      responses:
        '200':
          description: >-
            The asset written in the requested format. It is produced on request
            and never cached.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
                enum:
                  - attachment
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                enum:
                  - nosniff
            X-Illarin-Export-Target:
              required: true
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No such asset
  /v1/assets/{id}/media:
    get:
      operationId: listMedia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media belonging to the asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaList'
        '404':
          description: No such asset
    post:
      operationId: addMedia
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Send the metadata part before the image file part.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
                - file
              properties:
                metadata:
                  $ref: '#/components/schemas/AddMediaRequest'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: A new immutable media record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          description: The role or image is not valid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: The asset does not belong to the creator
        '409':
          description: The asset is withheld and cannot be changed
        '413':
          description: The image exceeds an upload limit or the account storage cap
        '503':
          description: The storage reserve cannot accept the image
  /media/{media_id}/{variant}/{derivative_version}:
    get:
      operationId: getMediaVariant
      parameters:
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variant
          in: path
          required: true
          schema:
            type: string
            enum:
              - grid
              - grid_blurred
              - detail
              - detail_blurred
              - thumb
              - thumb_blurred
              - og
              - og_blurred
        - name: derivative_version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: expires
          in: query
          description: >-
            When the signature runs out. A draft's images are served against a
            short-lived signature at the same address they keep once published.
          schema:
            type: string
        - name: signature
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A named media variant
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            Content-Disposition:
              required: true
              schema:
                type: string
                enum:
                  - inline
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                enum:
                  - nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No such media variant
        '503':
          description: The image is temporarily unavailable because storage is low
  /v1/ingests/{id}:
    get:
      operationId: getIngest
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The creator's ingest operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestOperation'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
        '404':
          description: No such ingest operation for this creator
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: illarin_session
    browserMutation:
      type: apiKey
      in: header
      name: X-Illarin-Request
      description: >-
        Required with the session cookie on state-changing browser requests. The
        value must be 1 and the Origin must be Illarin's browser origin.
    instanceToken:
      type: http
      scheme: bearer
      description: A short-lived access token issued to one linked instance.
    publicationToken:
      type: http
      scheme: bearer
      description: >-
        A publication token issued under one publication grant. It is not a
        session, it is not an instance token, and it carries no authority
        outside the publication it was issued for.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A value the client picks for one mutation. Sending it again with the
        same request returns the first outcome instead of doing the work twice;
        sending it again with a different request is refused.
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IllarinRequest:
      name: X-Illarin-Request
      in: header
      required: true
      description: Illarin's browser request proof. The value must be 1.
      schema:
        type: string
        enum:
          - '1'
  schemas:
    Scope:
      type: string
      enum:
        - asset:receive
        - library:sync
      description: >-
        asset:receive lets an instance receive assets sent to it. library:sync
        lets it report what it has installed.
    StartLinkRequest:
      type: object
      additionalProperties: false
      required:
        - applicationName
        - instanceName
        - protocolVersion
        - capabilities
        - acceptedTargets
        - scopes
      properties:
        applicationName:
          $ref: '#/components/schemas/ApplicationName'
        instanceName:
          $ref: '#/components/schemas/InstanceName'
        applicationVersion:
          $ref: '#/components/schemas/ApplicationVersion'
        protocolVersion:
          $ref: '#/components/schemas/LinkProtocolVersion'
        capabilities:
          $ref: '#/components/schemas/InstanceCapabilities'
        acceptedTargets:
          $ref: '#/components/schemas/AcceptedTargets'
        scopes:
          $ref: '#/components/schemas/Scopes'
    StartLinkAuthorization:
      type: object
      additionalProperties: false
      required:
        - applicationName
        - instanceName
        - protocolVersion
        - capabilities
        - acceptedTargets
        - scopes
        - redirectUri
        - state
        - codeChallenge
        - codeChallengeMethod
      properties:
        applicationName:
          $ref: '#/components/schemas/ApplicationName'
        instanceName:
          $ref: '#/components/schemas/InstanceName'
        applicationVersion:
          $ref: '#/components/schemas/ApplicationVersion'
        protocolVersion:
          $ref: '#/components/schemas/LinkProtocolVersion'
        capabilities:
          $ref: '#/components/schemas/InstanceCapabilities'
        acceptedTargets:
          $ref: '#/components/schemas/AcceptedTargets'
        scopes:
          $ref: '#/components/schemas/Scopes'
        redirectUri:
          type: string
          maxLength: 512
          description: >-
            An exact http callback using 127.0.0.1 or [::1], with an explicit
            port, a path, no user information, no query and no fragment.
        state:
          type: string
          minLength: 32
          maxLength: 128
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 43
        codeChallengeMethod:
          type: string
          enum:
            - S256
    ApplicationName:
      type: string
      minLength: 1
      maxLength: 64
      description: A self-asserted, unverified application name.
    InstanceName:
      type: string
      minLength: 1
      maxLength: 64
      description: A self-asserted name for this installation.
    ApplicationVersion:
      type:
        - string
        - 'null'
      minLength: 1
      maxLength: 64
    LinkProtocolVersion:
      type: integer
      enum:
        - 1
    CapabilityId:
      type: string
      minLength: 3
      maxLength: 64
      pattern: ^[a-z][a-z0-9.-]*:[a-z][a-z0-9._-]*$
      description: >-
        A namespaced interoperability claim. It never grants permission and
        unknown values have no effect.
    InstanceCapabilities:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        $ref: '#/components/schemas/CapabilityId'
    ExportTargetId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z0-9][a-z0-9._-]*$
      description: >-
        A format-module identifier accepted by the instance. Unknown values do
        not make a target available.
    AcceptedTargets:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        $ref: '#/components/schemas/ExportTargetId'
    Scopes:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Scope'
    UserCode:
      type: string
      minLength: 8
      maxLength: 16
      pattern: ^[BCDFGHJKLMNPQRSTVWXZ23456789bcdfghjklmnpqrstvwxz -]{8,16}$
    RequestCode:
      type: string
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
    DeviceCode:
      type: string
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
    ApprovalToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
    AuthorizationCode:
      type: string
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
    AccessToken:
      type: string
      minLength: 56
      maxLength: 56
      pattern: ^ia1\.[BCDFGHJKLMNPQRSTVWXZ23456789]{8}\.[A-Za-z0-9_-]{43}$
    RefreshToken:
      type: string
      minLength: 56
      maxLength: 56
      pattern: ^ir1\.[BCDFGHJKLMNPQRSTVWXZ23456789]{8}\.[A-Za-z0-9_-]{43}$
    LinkRequest:
      type: object
      required:
        - deviceCode
        - userCode
        - verificationUrl
        - expiresAt
        - interval
      properties:
        deviceCode:
          $ref: '#/components/schemas/DeviceCode'
          description: Kept private by the installation and sent when polling.
        userCode:
          $ref: '#/components/schemas/UserCode'
          description: Shown to the creator, who enters it on Illarin.
        verificationUrl:
          type: string
          description: Where the creator enters the user code.
        expiresAt:
          type: string
          format: date-time
        interval:
          type: integer
          description: Seconds to wait between polls.
    PollLinkRequest:
      type: object
      additionalProperties: false
      required:
        - deviceCode
      properties:
        deviceCode:
          $ref: '#/components/schemas/DeviceCode'
    PendingLinkPollResult:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
    LinkedLinkPollResult:
      type: object
      additionalProperties: false
      required:
        - status
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - instance
      properties:
        status:
          type: string
          enum:
            - linked
        accessToken:
          $ref: '#/components/schemas/AccessToken'
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: The 15-minute access-token deadline.
        refreshToken:
          $ref: '#/components/schemas/RefreshToken'
        instance:
          $ref: '#/components/schemas/LinkedInstance'
    LinkPollResult:
      oneOf:
        - $ref: '#/components/schemas/PendingLinkPollResult'
        - $ref: '#/components/schemas/LinkedLinkPollResult'
      discriminator:
        propertyName: status
        mapping:
          pending: '#/components/schemas/PendingLinkPollResult'
          linked: '#/components/schemas/LinkedLinkPollResult'
    PendingLink:
      type: object
      required:
        - applicationName
        - instanceName
        - protocolVersion
        - capabilities
        - acceptedTargets
        - scopes
        - expiresAt
      properties:
        applicationName:
          $ref: '#/components/schemas/ApplicationName'
        instanceName:
          $ref: '#/components/schemas/InstanceName'
        applicationVersion:
          $ref: '#/components/schemas/ApplicationVersion'
        protocolVersion:
          $ref: '#/components/schemas/LinkProtocolVersion'
        capabilities:
          $ref: '#/components/schemas/InstanceCapabilities'
        acceptedTargets:
          $ref: '#/components/schemas/AcceptedTargets'
        scopes:
          $ref: '#/components/schemas/Scopes'
        expiresAt:
          type: string
          format: date-time
    PendingDeviceLink:
      allOf:
        - $ref: '#/components/schemas/PendingLink'
        - type: object
          required:
            - approvalToken
          properties:
            approvalToken:
              $ref: '#/components/schemas/ApprovalToken'
              description: A private one-use proof that this code was reviewed.
    DeviceLinkDecision:
      type: object
      additionalProperties: false
      required:
        - approvalToken
      properties:
        approvalToken:
          $ref: '#/components/schemas/ApprovalToken'
    LinkAuthorization:
      type: object
      additionalProperties: false
      required:
        - authorizationUrl
        - expiresAt
      properties:
        authorizationUrl:
          type: string
          description: The Illarin page to open in the system browser.
        expiresAt:
          type: string
          format: date-time
    LinkRedirect:
      type: object
      additionalProperties: false
      required:
        - redirectUrl
      properties:
        redirectUrl:
          type: string
          description: A server-validated exact loopback redirect.
    ExchangeLinkAuthorization:
      type: object
      additionalProperties: false
      required:
        - authorizationCode
        - codeVerifier
        - redirectUri
      properties:
        authorizationCode:
          $ref: '#/components/schemas/AuthorizationCode'
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
        redirectUri:
          type: string
          maxLength: 512
    RefreshInstanceToken:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          $ref: '#/components/schemas/RefreshToken'
    InstanceTokenGrant:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - instance
      properties:
        accessToken:
          $ref: '#/components/schemas/AccessToken'
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: The 15-minute access-token deadline.
        refreshToken:
          $ref: '#/components/schemas/RefreshToken'
        instance:
          $ref: '#/components/schemas/LinkedInstance'
    UpdateInstance:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - capabilities
        - acceptedTargets
      properties:
        applicationVersion:
          $ref: '#/components/schemas/ApplicationVersion'
        protocolVersion:
          $ref: '#/components/schemas/LinkProtocolVersion'
        capabilities:
          $ref: '#/components/schemas/InstanceCapabilities'
        acceptedTargets:
          $ref: '#/components/schemas/AcceptedTargets'
    LinkedInstance:
      type: object
      required:
        - id
        - applicationName
        - instanceName
        - protocolVersion
        - capabilities
        - acceptedTargets
        - prefix
        - scopes
        - linkedAt
        - lastSeenAt
        - revokedAt
      properties:
        id:
          type: string
          format: uuid
        applicationName:
          type: string
        instanceName:
          type: string
        applicationVersion:
          type:
            - string
            - 'null'
        protocolVersion:
          type:
            - integer
            - 'null'
        capabilities:
          type: array
          items:
            type: string
        acceptedTargets:
          type: array
          items:
            type: string
        prefix:
          type: string
          description: The readable prefix of the current refresh token.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        linkedAt:
          type: string
          format: date-time
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
    LinkedInstanceList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedInstance'
    Account:
      type: object
      required:
        - id
        - handle
        - email
        - emailVerified
        - discordLinked
        - hasPassword
        - role
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        email:
          type:
            - string
            - 'null'
          format: email
        emailVerified:
          type: boolean
        discordLinked:
          type: boolean
        hasPassword:
          type: boolean
        role:
          type: string
          enum:
