        name:
          type: string
        blurb:
          type: string
        tags:
          type: array
          items:
            type: string
        isNsfw:
          type: boolean
        discovery:
          type: string
          enum:
            - listed
            - unlisted
    AddMediaRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - avatar
            - expression
            - gallery
            - avatar_alt
            - perspective_layer
            - pack_item
    Media:
      type: object
      required:
        - id
        - assetId
        - role
        - width
        - height
        - derivativeVersion
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - avatar
            - expression
            - gallery
            - avatar_alt
            - perspective_layer
            - pack_item
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        derivativeVersion:
          type: integer
          minimum: 1
    MediaList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Media'
    IngestOperation:
      type: object
      required:
        - id
        - status
        - url
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - processing
            - failed
            - success
        url:
          type: string
        asset:
          anyOf:
            - $ref: '#/components/schemas/Asset'
            - type: 'null'
        failure:
          $ref: '#/components/schemas/IngestFailure'
    IngestFailure:
      type: object
      required:
        - reason
        - message
      properties:
        reason:
          type: string
          enum:
            - malformed_input
            - unsupported_format
            - unsupported_version
            - safety_violation
            - wrong_kind
            - internal_failure
        message:
          type: string
    ProfileLink:
      type: object
      required:
        - label
        - address
      properties:
        label:
          type: string
        address:
          type: string
    SaveProfileRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
        - biography
        - contactEmail
        - links
      properties:
        displayName:
          type: string
          maxLength: 48
        biography:
          type: string
          maxLength: 400
        contactEmail:
          type: string
          maxLength: 254
        links:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ProfileLink'
    ProfileAvatar:
      type: object
      required:
        - url
        - width
        - height
      properties:
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
    ManagedInstance:
      allOf:
        - $ref: '#/components/schemas/LinkedInstance'
        - type: object
          required:
            - installed
            - updatesAvailable
          properties:
            installed:
              type: integer
              description: >-
                How many assets this instance has reported having installed. It
                is zero without the library:sync scope.
            updatesAvailable:
              type: integer
              description: >-
                How many of those the creator has since changed, so a newer
                content generation exists here than the instance reported.
    CollectDeliveries:
      type: object
      additionalProperties: false
      required:
        - acknowledge
      properties:
        acknowledge:
          type: array
          maxItems: 32
          uniqueItems: true
          description: >-
            The deliveries this instance has durably installed since its last
            request. Delivery is at least once, so treat the ids as stable and
            acknowledge only after the work is safely stored.
          items:
            type: string
            format: uuid
    DeliveryArtifact:
      type: object
      additionalProperties: false
      required:
        - kind
        - url
      properties:
        kind:
          type: string
          enum:
            - export
            - picture
        url:
          type: string
          description: A short-lived signed address fetched with an ordinary GET.
        mediaId:
          type: string
          format: uuid
        role:
          type: string
        isCover:
          type: boolean
    DeliveryWork:
      type: object
      additionalProperties: false
      required:
        - id
        - assetId
        - contentGeneration
        - kind
        - name
        - format
        - label
        - queuedAt
        - leaseExpiresAt
        - artifacts
      properties:
        id:
          type: string
          format: uuid
          description: The stable event id to acknowledge and to deduplicate on.
        assetId:
          type: string
          format: uuid
        contentGeneration:
          type: integer
          minimum: 1
          description: >-
            The update signal. Store it against the asset id; a newer one means
            the file changed.
        kind:
          type: string
        name:
          type: string
        format:
          type: string
          description: >-
            The chosen export target, or raw for the creator's own uploaded
            file.
        label:
          type: string
        queuedAt:
          type: string
          format: date-time
        leaseExpiresAt:
          type: string
          format: date-time
          description: >-
            When the artifact addresses stop answering and the delivery becomes
            collectable again.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryArtifact'
    DeliveryWorkList:
      type: object
      additionalProperties: false
      required:
        - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryWork'
    LibraryEntry:
      type: object
      additionalProperties: false
      required:
        - assetId
      properties:
        assetId:
          type: string
          format: uuid
        contentGeneration:
          type: integer
          minimum: 1
          description: >-
            The generation this instance holds. Leave it out when the
            installation predates the counter; Illarin records the asset's
            current one rather than calling the install out of date.
    LibraryReport:
      type: object
      additionalProperties: false
      required:
        - snapshot
        - entries
      properties:
        snapshot:
          type: boolean
          description: >-
            True to replace the whole mirror for this instance. A snapshot
