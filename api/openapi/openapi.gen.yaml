        - thumbUrl
        - width
        - height
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - avatar
            - expression
            - gallery
            - avatar_alt
            - perspective_layer
            - pack_item
        isCover:
          type: boolean
        detailUrl:
          type: string
        thumbUrl:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    AssetList:
      type: object
      required:
        - items
