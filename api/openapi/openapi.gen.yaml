      properties:
        schema:
          type: string
          enum:
            - lumia
        records:
          type: array
          items:
            type: object
            required:
              - lumiaName
              - lumiaDefinition
              - lumiaPersonality
              - lumiaBehavior
              - genderIdentity
              - authorName
              - version
            properties:
              id:
                type: string
                format: uuid
              lumiaName:
                type: string
              lumiaDefinition:
                type: string
              lumiaPersonality:
                type: string
              lumiaBehavior:
                type: string
              avatarUrl:
                description: The asset-scoped media id for this item's avatar.
                type: string
                format: uuid
              genderIdentity:
                type: integer
                enum:
                  - 0
                  - 1
                  - 2
              authorName:
                type: string
              version:
                type: integer
                minimum: 1
    ScriptListContent:
      type: object
      required:
        - scripts
      description: A preset's find and replace scripts, in the order they run.
      properties:
        scripts:
          type: array
          items:
            type: object
            required:
              - find
              - replace
              - enabled
            properties:
              id:
                description: >-
                  Illarin's own id for this item, minted when the item is
                  created. Preserved data keys against it, so send it back
                  unchanged; an item with no id is a new one.
                type: string
                format: uuid
              name:
                type: string
              description:
                type: string
              find:
                type: string
              flags:
                description: The expression's own, such as g for every match.
                type: string
              replace:
                type: string
              trim:
                description: Text cut out of the match before the replacement is written.
                type: array
                items:
                  type: string
              targets:
                description: The text the script runs over.
                type: array
                items:
                  type: string
                  enum:
                    - user_input
                    - model_output
                    - slash_command
                    - lorebook
              affects:
                description: What the replacement changes.
                type: array
                items:
                  type: string
                  enum:
                    - display
                    - prompt
              enabled:
                type: boolean
              minDepth:
                type: integer
              maxDepth:
                type: integer
              runOnEdit:
                type: boolean
    ElementType:
      type: string
      description: What an element's data structure is, from the global vocabulary.
      enum:
        - prose
        - text_set
        - field_list
        - dialogue_sample
        - image_set
        - link_list
        - entry_table
        - prompt_list
        - variable_schema
        - setting_group
        - script_list
        - color_set
        - stylesheet_set
        - record_list
    ItemSize:
      type: string
      description: >-
        How large the images inside an element are drawn. It names what it
        controls, and no element type declares a measurement of its own.
      enum:
        - small
        - medium
        - large
    AddAssetBlockRequest:
      type: object
      additionalProperties: false
      required:
        - definition
        - elementType
      properties:
        definition:
          type: string
        elementType:
          $ref: '#/components/schemas/ElementType'
    AddableBlock:
      type: object
      description: >-
        One block the add tray offers. Where the content ends up is what the
        tray groups by, so a creator arrives at it by destination.
      required:
        - definition
        - title
        - summary
        - group
        - groupTitle
        - repeatable
        - choices
      properties:
        definition:
          type: string
        title:
          type: string
        summary:
          type: string
        group:
          type: string
          enum:
            - file
            - reader
            - work
            - other
        groupTitle:
          type: string
        repeatable:
          type: boolean
        choices:
          type: array
          description: >-
            The elements a creator may start the block with. One choice needs no
            question asking.
          items:
            $ref: '#/components/schemas/AddableBlockChoice'
    AddableBlockChoice:
      type: object
      required:
        - type
        - label
      properties:
        type:
          $ref: '#/components/schemas/ElementType'
        label:
          type: string
    Asset:
      type: object
      required:
        - id
        - kind
        - format
        - name
        - blurb
        - tags
        - isNsfw
        - discovery
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        format:
          type: string
        name:
          type: string
        blurb:
          type: string
        tags:
          type: array
          items:
            type: string
        isNsfw:
          type:
            - boolean
            - 'null'
        discovery:
          type: string
          enum:
            - listed
            - unlisted
        createdAt:
          type: string
          format: date-time
    AssetDetail:
      type: object
      required:
        - id
        - kind
        - name
        - blurb
        - tags
        - creator
        - isNsfw
        - discovery
        - lifecycle
        - isOwner
        - linkedInstallOnly
        - allowedApps
        - eligibleApps
        - downloads
        - original
        - createdAt
        - blocks
        - media
        - preview
        - visibility
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - character
            - lorebook
            - preset
            - theme
            - pack
        name:
          type: string
        blurb:
          type: string
          description: >-
            The catalog blurb the creator wrote for a person. Never the file's
            own description, which is a prompt written for a model.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/AssetTag'
        creator:
          type: string
        isNsfw:
          description: >-
            Null while a draft has not been asked the adult content question.
            Nothing answers it on the creator's behalf.
          type:
            - boolean
            - 'null'
        discovery:
          type: string
          enum:
            - listed
            - unlisted
        lifecycle:
          type: string
          enum:
            - draft
            - published
          description: >-
            A draft resolves for its owner alone. Discovery applies to a
            published asset only.
        isOwner:
          type: boolean
          description: >-
            Whether the reader owns the asset. The owner's page is the reader's
            page with its editing affordances, not a second visual state.
        linkedInstallOnly:
          type: boolean
          description: Whether protected content keeps ordinary downloads unavailable.
        allowedApps:
          type: array
          description: The applications the creator allows to receive protected content.
          items:
            type: string
            enum:
              - lumiverse
        eligibleApps:
          type: array
          description: The applications with a target this asset can currently export to.
          items:
            type: string
            enum:
              - lumiverse
        downloads:
          type: array
          description: >-
            The formats this asset is offered in, read from its projection. A
            format Illarin cannot produce for the asset is absent rather than
            listed as unavailable, so this is a list of choices and not a
            capability report.
          items:
            $ref: '#/components/schemas/DownloadTarget'
        original:
          description: >-
            The creator's own upload. Null for an asset built from nothing,
            which gets no group saying so.
          oneOf:
            - $ref: '#/components/schemas/OriginalUpload'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        blocks:
          type: array
          description: The asset's blocks in page order.
          items:
            $ref: '#/components/schemas/AssetBlock'
        media:
          type: array
          description: >-
            The asset's images, cover first. Variant URLs already reflect the
            reader's preference, so a blurred reader is never handed a clear
            one.
          items:
            $ref: '#/components/schemas/AssetImage'
        preview:
          description: >-
            The composed social preview for link unfurling. Null on a draft,
            which nothing unfurls.
          anyOf:
            - type: string
            - type: 'null'
        readiness:
          description: >-
            The publish floor, present only while the owner is reading their own
            asset. A draft carries the whole list, because publishing waits on
            it. A published page carries it only where it falls short, which is
            how a migrated asset shows its owner what to come back and fix.
          type: array
          items:
            $ref: '#/components/schemas/ReadinessItem'
        sealedBlocks:
          type: integer
          description: >-
            How many sealed v1 preset blocks the asset preserves. Present only
            while the owner is reading their own asset, and absent where there
            are none, so a stranger cannot learn that an asset is withholding
            anything.
        addableBlocks:
          description: >-
            The blocks this kind can still be given, in catalog order. Present
            only while the owner is reading their own asset.
          type: array
          items:
            $ref: '#/components/schemas/AddableBlock'
        visibility:
          type: string
          enum:
            - hidden
            - blurred
            - shown
        withhold:
          $ref: '#/components/schemas/AssetWithhold'
    DownloadTarget:
      type: object
      required:
        - format
        - label
        - recommended
        - roles
      properties:
        format:
          type: string
          description: The format id, which is also the download's target.
        label:
          type: string
        recommended:
          type: boolean
          description: >-
            Computed by the widest-compatibility rule and never chosen by a
            creator: the format that loses the least among the formats most apps
            can open.
        roles:
          type: array
          description: One verdict per role this asset has content for.
          items:
            $ref: '#/components/schemas/DownloadRoleVerdict'
    DownloadRoleVerdict:
      type: object
      required:
        - role
        - label
        - verdict
        - sample
      properties:
        role:
          type: string
        label:
          type: string
        verdict:
          type: string
          enum:
            - carried
            - reduced
            - dropped
        reason:
          type: string
          description: What went, on a reduced verdict.
        destination:
          type: string
          description: >-
            Where the content lands when that is not the format's standard home
            for it. Independent of how much survives, so it rides on a carried
            verdict too.
        sample:
          $ref: '#/components/schemas/DownloadSample'
    DownloadSample:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          description: How many things the role holds in all.
        texts:
          type: array
          description: Entry names and greeting openings, a few of them.
          items:
            type: string
        images:
          type: array
          description: The media ids of a few of the pictures at stake.
          items:
            type: string
            format: uuid
    OriginalUpload:
      type: object
      required:
        - label
        - mediaType
        - arrivedAt
      properties:
        label:
          type: string
        mediaType:
          type: string
        arrivedAt:
          type: string
          format: date-time
    PreservedNamespace:
      type: object
      required:
        - name
        - bytes
      properties:
        name:
          type: string
          description: The namespace as the file that carried it named it.
        bytes:
          type: integer
          description: How much the asset is holding under this namespace.
    AssetDiscoveryRequest:
      type: object
      additionalProperties: false
      required:
        - discovery
      properties:
        discovery:
          type: string
          enum:
            - listed
            - unlisted
    AssetIdentityRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - isNsfw
      properties:
        name:
          type: string
        isNsfw:
          description: Null is the unanswered state, which only a draft may be in.
          type:
            - boolean
            - 'null'
    ReadinessItem:
      type: object
      required:
        - id
        - label
        - detail
        - met
      description: One thing publication waits on, and whether the asset carries it.
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        met:
          type: boolean
        blockId:
          description: The block a creator fills this in. Absent for a header field.
          type: string
          format: uuid
    PublishRefusal:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        readiness:
          description: The whole floor, so a refusal names every missing item at once.
          type: array
          items:
            $ref: '#/components/schemas/ReadinessItem'
    DeletedAssetList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeletedAsset'
    DeletedAsset:
      type: object
      required:
        - id
        - name
        - kind
        - deletedAt
        - recoverableUntil
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - character
            - lorebook
            - preset
            - theme
            - pack
        deletedAt:
          type: string
          format: date-time
        recoverableUntil:
          type: string
          format: date-time
    WithholdAssetRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
    AssetWithhold:
      type: object
      additionalProperties: false
      required:
        - reason
