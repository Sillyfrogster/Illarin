        entries:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/LibraryEntry'
        removed:
          type: array
          maxItems: 2000
          uniqueItems: true
          items:
            type: string
            format: uuid
    LibraryReportResult:
      type: object
      additionalProperties: false
      required:
        - accepted
        - removed
        - ignored
      properties:
        accepted:
          type: integer
        removed:
          type: integer
        ignored:
          type: integer
          description: Entries naming an asset Illarin cannot offer.
    QueuedDelivery:
      type: object
      additionalProperties: false
      required:
        - id
