        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
    put:
      operationId: savePost
      description: >-
        Replace the working copy. The request names the version it began from,
        and a stale version is refused rather than applied.
      security:
        - sessionCookie: []
          browserMutation: []
        - publicationToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
