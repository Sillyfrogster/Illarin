      additionalProperties: false
      required:
        - id
        - name
        - kind
        - state
        - byDefault
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - webhook
        state:
          $ref: '#/components/schemas/PublicationDestinationState'
        byDefault:
          type: boolean
          description: Whether a publication starts with this one selected.
    PostScheduleState:
      type: string
      description: Where a schedule got to.
      enum:
        - pending
        - publishing
        - published
        - cancelled
        - stopped
    PostSchedule:
      type: object
      description: >-
        The post's most recent schedule. It names the exact edition that will go
        live and the instant it goes, both in UTC.
      required:
        - id
        - revisionId
        - revisionNumber
        - at
        - state
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        revisionNumber:
          type: integer
        at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/PostScheduleState'
        stoppedBecause:
          type: string
          description: Why Illarin stopped a schedule instead of publishing it.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    PostDeletion:
      type: object
      description: >-
        A deleted post and the deadline it has to come back by. Nothing about it
        is public, and readers were never shown any of it.
      required:
        - at
        - until
        - by
      properties:
        at:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
          description: When the post and everything it holds are removed for good.
        by:
          type: string
    PostRevisionReason:
      type: string
      description: Why an edition was kept.
      enum:
        - checkpoint
        - publication
        - schedule
    PostRevision:
      type: object
      description: >-
        One immutable edition of a post. It carries what the edition was called
        and when it was kept, not the words it holds.
      required:
        - id
        - number
        - title
        - summary
        - slug
        - category
        - capturedFor
        - capturedBy
        - capturedAt
        - public
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        title:
          type: string
        summary:
          type: string
        slug:
          type: string
        category:
          $ref: '#/components/schemas/PublicationCategory'
        capturedFor:
          $ref: '#/components/schemas/PostRevisionReason'
        capturedBy:
          type: string
        capturedAt:
          type: string
          format: date-time
        public:
          type: boolean
          description: Whether this is the edition readers are being given.
    PostRevisionList:
      type: object
      required:
        - revisions
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/PostRevision'
    PostVersionRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          description: The working-copy version the action means to act on.
    PublicationEvent:
      type: string
      description: One Publication event a destination may subscribe to.
      enum:
        - publication.post.published.v1
        - publication.post.updated.v1
        - publication.post.withdrawn.v1
    PublicationDestination:
      type: object
      description: >-
        One configured endpoint as anybody is ever shown it. The address is
        masked to its host and the signing secret is absent.
      additionalProperties: false
      required:
        - id
        - kind
        - name
        - host
        - address
        - state
        - events
        - secretSetAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - webhook
        name:
          type: string
          description: What the authority calls this endpoint, and all a contributor sees.
        host:
          type: string
          description: The host the endpoint answers on.
        address:
          type: string
          description: The masked address, which names the host and hides the rest.
        state:
          $ref: '#/components/schemas/PublicationDestinationState'
        events:
          type: array
          description: Which Publication events this endpoint asked for.
          items:
            $ref: '#/components/schemas/PublicationEvent'
        secretSetAt:
          type: string
          format: date-time
          description: When the current signing secret was drawn.
        previousSecretUntil:
          type: string
          format: date-time
          nullable: true
          description: >-
            How long a rotated secret keeps producing an accepted signature,
            absent when no rotation is in its overlap.
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    PublicationDestinationList:
      type: object
      additionalProperties: false
      required:
        - destinations
      properties:
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/PublicationDestination'
    AddPublicationDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - address
      properties:
        name:
          type: string
          maxLength: 48
        address:
          type: string
          maxLength: 300
          description: >-
            An https address on port 443 with no username, password or fragment,
            whose host resolves into public address space.
        events:
          type: array
          description: >-
            Which Publication events this endpoint receives. An absent list
            takes published events and nothing else.
          items:
            $ref: '#/components/schemas/PublicationEvent'
    AddedPublicationDestination:
      type: object
      description: A new destination and the one showing its signing secret ever gets.
      additionalProperties: false
      required:
        - destination
        - secret
      properties:
        destination:
          $ref: '#/components/schemas/PublicationDestination'
        secret:
          type: string
          description: >-
            The signing secret this endpoint's requests carry. Illarin cannot
            show it again.
    UpdatePublicationDestinationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 48
        address:
          type: string
          maxLength: 300
        events:
          type: array
          description: >-
            Which Publication events this endpoint receives. An absent list
            leaves the subscription alone.
          items:
            $ref: '#/components/schemas/PublicationEvent'
    RotatedPublicationSecret:
      type: object
      description: >-
        A destination's new signing secret and how long the old one stays
        acceptable alongside it.
      additionalProperties: false
      required:
        - destination
        - secret
        - previousSecretUntil
      properties:
        destination:
          $ref: '#/components/schemas/PublicationDestination'
        secret:
          type: string
          description: >-
            The signing secret this endpoint's requests now carry. Illarin
            cannot show it again.
        previousSecretUntil:
          type: string
          format: date-time
          description: When the old secret stops producing an accepted signature.
    PostDeliveryState:
      type: string
      description: >-
        Where one delivery stands. Neither settled state changes whether the
        post is public.
      enum:
        - pending
        - sending
        - delivered
        - failed
    PostDeliverySettledReason:
      type: string
      description: Why a delivery stopped, absent while it is still going.
      enum:
        - arrived
        - exhausted
        - refused
        - gone
        - removed
        - disabled
        - moved
    PostDeliveryOutcome:
      type: string
      description: What one attempt found at the far end.
      enum:
        - delivered
        - refused
        - unreachable
    PostDeliveryAttempt:
      type: object
      description: >-
        The safe record of one request. It holds no body, in either direction,
        and no header Illarin signed it with.
      additionalProperties: false
      required:
        - run
        - number
        - outcome
        - detail
        - tookMs
        - attemptedAt
      properties:
        run:
          type: integer
          description: Which attempt sequence this belongs to; a replay opens the next.
        number:
          type: integer
        outcome:
          $ref: '#/components/schemas/PostDeliveryOutcome'
        status:
          type: integer
          nullable: true
          description: What the endpoint answered, absent when nothing was reached.
        detail:
          type: string
          description: A safe sentence about the attempt, never a response body.
        tookMs:
          type: integer
        attemptedAt:
          type: string
          format: date-time
    PostDelivery:
      type: object
      description: One publication event on its way to one destination.
      additionalProperties: false
      required:
        - id
        - eventId
        - eventType
        - postId
        - postTitle
        - revisionId
        - destination
        - removed
        - state
        - run
        - attempts
        - occurredAt
        - dueAt
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        postId:
          type: string
          format: uuid
        postTitle:
          type: string
          description: The title the edition behind this event carries.
        revisionId:
          type: string
          format: uuid
        destination:
          type: string
          description: The name the destination carried when this event was captured.
        removed:
          type: boolean
          description: Whether the destination behind this delivery is gone.
        state:
          $ref: '#/components/schemas/PostDeliveryState'
        settledReason:
          $ref: '#/components/schemas/PostDeliverySettledReason'
        run:
          type: integer
          description: Which attempt sequence the delivery is on; a replay opens the next.
        attempts:
          type: integer
        occurredAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          description: When the next attempt is due, in the past once it has settled.
        settledAt:
          type: string
          format: date-time
          nullable: true
        last:
          allOf:
            - $ref: '#/components/schemas/PostDeliveryAttempt'
          description: The most recent attempt, absent until one has been made.
    PostDeliveryList:
      type: object
      additionalProperties: false
      required:
        - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/PostDelivery'
    PostDeliveryAttemptList:
      type: object
      description: Every attempt one delivery has made, oldest first.
      additionalProperties: false
      required:
        - attempts
      properties:
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/PostDeliveryAttempt'
    DestinationPolicyRequest:
      type: object
      additionalProperties: false
      properties:
        destinationIds:
          type: array
          nullable: true
          description: >-
            The destinations this policy allows. An absent list on a grant puts
            it back on its app's baseline; an empty list allows nothing.
          items:
            type: string
            format: uuid
        defaultDestinationIds:
          type: array
          description: Which of the allowed destinations a publication starts with.
          items:
            type: string
            format: uuid
    PublicationDestinationChoiceList:
      type: object
      additionalProperties: false
      required:
        - destinations
        - inherited
      properties:
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/PublicationDestinationChoice'
        inherited:
          type: boolean
          description: Whether this set comes from the app rather than being its own.
    PostAction:
      type: object
      description: >-
        One thing that was done to a post, named by who did it, what it was and
        which edition it touched.
      required:
        - id
        - actor
        - credential
        - action
        - at
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        credential:
          type: string
        action:
          type: string
        revision:
          anyOf:
            - type: integer
            - type: 'null'
        before:
          type: string
        after:
          type: string
        at:
          type: string
          format: date-time
    PostActionList:
      type: object
      required:
        - actions
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PostAction'
    PublishPostRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          description: The working-copy version the action means to act on.
        destinationIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        note:
          type: string
          maxLength: 500
    ReplacePostScheduleRequest:
      type: object
      additionalProperties: false
      required:
        - revisionId
        - at
      properties:
        destinationIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        note:
          type: string
          maxLength: 500
        revisionId:
          type: string
          format: uuid
          description: An edition the post has already kept.
        at:
          type: string
          format: date-time
          description: When the edition goes live, with an explicit offset.
    SchedulePostRequest:
      type: object
      additionalProperties: false
      required:
        - version
        - at
      properties:
        version:
          type: integer
          description: The working-copy version the edition is captured from.
        at:
          type: string
          format: date-time
          description: When the edition goes live, with an explicit offset.
        destinationIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        note:
          type: string
          maxLength: 500
    PostSummary:
      type: object
      description: >-
        One published post as an archive lists it. Every field is stored on the
        published edition, so a listing writes no excerpt and reads no live
        profile.
      required:
        - id
        - slug
        - originalSlug
        - title
        - summary
        - category
        - byline
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        originalSlug:
          type: string
          description: >-
            The address the post first published under. It still reaches the
            post after an address correction, so a feed can name the post by an
            address that never changes.
        title:
          type: string
        summary:
          type: string
        category:
          $ref: '#/components/schemas/PublicationCategory'
        app:
          anyOf:
            - $ref: '#/components/schemas/PublicationApp'
            - type: 'null'
        releaseVersion:
          type: string
        byline:
          $ref: '#/components/schemas/PostByline'
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PostArchive:
      type: object
      description: One page of the published archive and the scope it was read under.
      required:
        - posts
        - page
        - pages
        - total
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
        page:
          type: integer
        pages:
          type: integer
        total:
          type: integer
        category:
          anyOf:
            - $ref: '#/components/schemas/PublicationCategory'
            - type: 'null'
        app:
          anyOf:
            - $ref: '#/components/schemas/PublicationApp'
            - type: 'null'
    LegacyAsset:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
  responses:
    PublicationUnauthenticated:
      description: The request carries no live credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationError'
    PublicationForbidden:
      description: The credential may not reach that
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationError'
    PublicationTooManyRequests:
      description: The credential has gone past the pace this operation allows
      headers:
        Retry-After:
          description: Seconds to wait before repeating the request
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationError'
    PublicationInvalid:
      description: A field, the post document or the request itself is not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationError'
    PublicationNotFound:
      description: Nothing this credential may reach has that identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationError'
