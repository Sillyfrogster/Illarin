      description: >-
        Upload one picture against this post. The record is immutable: replacing
        a picture uploads new bytes at a new address rather than changing an
        address readers already hold.
      security:
        - sessionCookie: []
          browserMutation: []
        - publicationToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Send the metadata part before the image file part.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
                - file
              properties:
                metadata:
                  $ref: '#/components/schemas/AddPostMediaRequest'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: A new immutable post picture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMedia'
        '400':
          $ref: '#/components/responses/PublicationInvalid'
        '401':
          $ref: '#/components/responses/PublicationUnauthenticated'
        '403':
          $ref: '#/components/responses/PublicationForbidden'
        '404':
          $ref: '#/components/responses/PublicationNotFound'
        '409':
          description: The working copy moved on, or the key was reused for another request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
        '413':
          description: The image exceeds the upload limit
        '429':
          $ref: '#/components/responses/PublicationTooManyRequests'
        '503':
          description: The storage reserve cannot accept the image
  /v1/publication/posts/{id}/revisions:
    get:
      operationId: listPostRevisions
      description: >-
        Every edition this post has kept, newest first. It names titles, times
        and keepers, and never compares two editions for a reader.
      security:
        - sessionCookie: []
        - publicationToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The editions this post has kept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostRevisionList'
        '401':
