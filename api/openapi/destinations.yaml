paths:
  /v1/publication/destinations:
    get:
      operationId: listPublicationDestinations
      description: >-
        Every configured destination, masked. Only the publication authority
        may read it, and even it cannot read back an endpoint address or a
        signing secret.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The configured destinations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestinationList'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
    post:
      operationId: addPublicationDestination
      description: >-
        Configure one endpoint. The response is the only time Illarin can show
        its signing secret, and the endpoint receives nothing until it has
        answered a verification challenge.
      security:
        - sessionCookie: []
          browserMutation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPublicationDestinationRequest'
      responses:
        '201':
          description: The destination and its signing secret, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddedPublicationDestination'
        '400':
          $ref: ./publication.yaml#/components/responses/PublicationInvalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
  /v1/publication/channels:
    post:
      operationId: addPublicationChannel
      description: >-
        Configure one Discord channel. Illarin asks Discord what the capability
        address is for and keeps only the guild and channel it names, so the
        address itself is never shown again.
      security:
        - sessionCookie: []
          browserMutation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationChannelRequest'
      responses:
        '201':
          description: The destination, already proved by Discord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestination'
        '400':
          $ref: ./publication.yaml#/components/responses/PublicationInvalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
  /v1/publication/channels/{id}:
    patch:
      operationId: updatePublicationChannel
      description: >-
        Rename a Discord destination, change the role an author may ask for, or
        point it at another capability, which Discord is asked about again.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationChannelRequest'
      responses:
        '200':
          description: The destination as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestination'
        '400':
          $ref: ./publication.yaml#/components/responses/PublicationInvalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
  /v1/publication/destinations/{id}:
    patch:
      operationId: updatePublicationDestination
      description: >-
        Rename a destination or point it somewhere else. A new address takes it
        back to unverified, because control of the old one proves nothing about
        the new one.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicationDestinationRequest'
      responses:
        '200':
          description: The destination as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestination'
        '400':
          $ref: ./publication.yaml#/components/responses/PublicationInvalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
    delete:
      operationId: removePublicationDestination
      description: >-
        Take a destination out of the configuration. Every delivery it already
        holds keeps the name it was sent under.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The destination is gone
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
  /v1/publication/destinations/{id}/verification:
    post:
      operationId: verifyPublicationDestination
      description: >-
        Send one signed challenge and activate the destination only when the
        exact value comes back.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The destination, now active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestination'
        '400':
          $ref: ./publication.yaml#/components/responses/PublicationInvalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
    delete:
      operationId: disablePublicationDestination
      description: >-
        Stop a destination receiving anything further. What it has already
        received stays where it is.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The destination, now disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDestination'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
  /v1/publication/destinations/{id}/secret:
    post:
      operationId: rotatePublicationDestinationSecret
      description: >-
        Draw a new signing secret. The old one keeps producing an accepted
        signature for a bounded overlap, so a receiver changes over without
        dropping an event, and is then forgotten.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The new signing secret, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedPublicationSecret'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such destination
  /v1/publication/deliveries:
    get:
      operationId: listPublicationDeliveries
      description: >-
        The delivery work the authority is diagnosing, newest first. It carries
        no endpoint address, secret or response body.
      security:
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          description: Narrow the listing to one state.
          schema:
            $ref: './posts.yaml#/components/schemas/PostDeliveryState'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The delivery work on record
          content:
            application/json:
              schema:
                $ref: './posts.yaml#/components/schemas/PostDeliveryList'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
  /v1/publication/deliveries/{id}/attempts:
    get:
      operationId: listPublicationDeliveryAttempts
      description: >-
        Every attempt one delivery has made, across every run, so a replay
        never hides what the runs before it found.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The attempts this delivery has made
          content:
            application/json:
              schema:
                $ref: './posts.yaml#/components/schemas/PostDeliveryAttemptList'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such delivery
  /v1/publication/deliveries/{id}/replay:
    post:
      operationId: replayPublicationDelivery
      description: >-
        Put settled work back in the queue under a new run. The Publication
        event it carries and every attempt already made stay as they are.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The delivery, queued again
          content:
            application/json:
              schema:
                $ref: './posts.yaml#/components/schemas/PostDelivery'
        '400':
          $ref: ./publication.yaml#/components/responses/PublicationInvalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such delivery
  /v1/publication/deliveries/{id}/repair:
    post:
      operationId: repairDiscordAnnouncement
      description: >-
        Explicitly edit a Discord message's note, delete the named message,
        or send a separate correction. Requires publication authority.
        Reusing a request ID returns the recorded result without another send.
        The post, event and original delivery attempts remain unchanged.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, action]
              properties:
                requestId: { type: string, format: uuid }
                action: { type: string, enum: [edit, delete, correction] }
                messageId: { type: string, pattern: '^[0-9]{17,20}$' }
                text: { type: string, maxLength: 1800 }
      responses:
        '200':
          description: The recorded repair outcome; unconfirmed results need a channel check
          content:
            application/json:
              schema:
                type: object
                required: [action, messageId, state, detail]
                properties:
                  action: { type: string }
                  messageId: { type: string }
                  state: { type: string, enum: [completed, refused, unconfirmed] }
                  detail: { type: string }
        '400':
          $ref: ./publication.yaml#/components/responses/PublicationInvalid
        '401':
          description: No account is signed in
        '403':
          description: The account does not have publication authority
        '404':
          description: No such delivery or destination
  /v1/publication/apps/{id}/destinations:
    put:
      operationId: setPublicationAppDestinations
      description: >-
        Record the destinations every grant on one app may send to, and which
        of them a publication starts with.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationPolicyRequest'
      responses:
        '200':
          description: The app with the destinations it now allows
          content:
            application/json:
              schema:
                $ref: './publication.yaml#/components/schemas/PublicationApp'
        '400':
          $ref: ./publication.yaml#/components/responses/PublicationInvalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such app or destination
  /v1/publication/grants/{id}/destinations:
    put:
      operationId: setPublicationGrantDestinations
      description: >-
        Narrow one contributor to its own destinations, or send an absent set
        to put the grant back on its app's baseline.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationPolicyRequest'
      responses:
        '200':
          description: The grant with the destinations it now allows
          content:
            application/json:
              schema:
                $ref: './publication.yaml#/components/schemas/PublicationGrant'
        '400':
          $ref: ./publication.yaml#/components/responses/PublicationInvalid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such grant or destination
components:
  schemas:
    PublicationDestinationKind:
      type: string
      description: >-
        What a destination is. A webhook receives the signed event; a Discord
        channel receives an announcement Illarin composed.
      enum:
        - webhook
        - discord
    PublicationDestinationState:
      type: string
      description: Whether a destination is ready to receive anything.
      enum:
        - unverified
        - active
        - disabled
    PublicationEvent:
      type: string
      description: One Publication event a destination may subscribe to.
      enum:
        - publication.post.published.v1
        - publication.post.updated.v1
        - publication.post.withdrawn.v1
    PublicationDestination:
      type: object
      description: >-
        One configured endpoint as anybody is ever shown it. The address is
        masked to its host and the signing secret is absent.
      additionalProperties: false
      required:
        - id
        - kind
        - name
        - host
        - address
        - state
        - events
        - secretSetAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PublicationDestinationKind'
        name:
          type: string
          description: What the authority calls this endpoint, and all a contributor sees.
        host:
          type: string
          description: The host the endpoint answers on.
        address:
          type: string
          description: The masked address, which names the host and hides the rest.
        state:
          $ref: '#/components/schemas/PublicationDestinationState'
        events:
          type: array
          description: Which Publication events this endpoint asked for.
          items:
            $ref: '#/components/schemas/PublicationEvent'
        channel:
          allOf:
            - $ref: '#/components/schemas/PublicationChannel'
          description: >-
            Where a Discord destination announces, absent on a generic webhook.
        secretSetAt:
          type: string
          format: date-time
          description: When the current signing secret was drawn.
        previousSecretUntil:
          type: string
          format: date-time
          nullable: true
          description: >-
            How long a rotated secret keeps producing an accepted signature,
            absent when no rotation is in its overlap.
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    PublicationDestinationList:
      type: object
      additionalProperties: false
      required:
        - destinations
      properties:
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/PublicationDestination'
    AddedPublicationDestination:
      type: object
      description: A new destination and the one showing its signing secret ever gets.
      additionalProperties: false
      required:
        - destination
        - secret
      properties:
        destination:
          $ref: '#/components/schemas/PublicationDestination'
        secret:
          type: string
          description: >-
            The signing secret this endpoint's requests carry. Illarin cannot
            show it again.
    RotatedPublicationSecret:
      type: object
      description: >-
        A destination's new signing secret and how long the old one stays
        acceptable alongside it.
      additionalProperties: false
      required:
        - destination
        - secret
        - previousSecretUntil
      properties:
        destination:
          $ref: '#/components/schemas/PublicationDestination'
        secret:
          type: string
          description: >-
            The signing secret this endpoint's requests now carry. Illarin
            cannot show it again.
        previousSecretUntil:
          type: string
          format: date-time
          description: When the old secret stops producing an accepted signature.
    AddPublicationDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - address
      properties:
        name:
          type: string
          maxLength: 48
        address:
          type: string
          maxLength: 300
          description: >-
            An https address on port 443 with no username, password or
            fragment, whose host resolves into public address space.
        events:
          type: array
          description: >-
            Which Publication events this endpoint receives. An absent list
            takes published events and nothing else.
          items:
            $ref: '#/components/schemas/PublicationEvent'
    UpdatePublicationDestinationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 48
        address:
          type: string
          maxLength: 300
        events:
          type: array
          description: >-
            Which Publication events this endpoint receives. An absent list
            leaves the subscription alone.
          items:
            $ref: '#/components/schemas/PublicationEvent' 
    PublicationDestinationChoice:
      type: object
      description: >-
        One destination a post may send to. It carries no address and no
        secret, which is the whole point of it.
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - state
        - events
        - role
        - byDefault
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/PublicationDestinationKind'
        state:
          $ref: '#/components/schemas/PublicationDestinationState'
        events:
          type: array
          description: >-
            Which public transitions this destination receives, so a publisher
            is only offered the ones this transition would reach.
          items:
            $ref: '#/components/schemas/PublicationEvent'
        role:
          type: string
          description: >-
            The notification role an author may ask this destination to
            mention, empty when the authority approved none.
        byDefault:
          type: boolean
          description: Whether a publication starts with this one selected.
    PublicationDestinationChoiceList:
      type: object
      additionalProperties: false
      required:
        - destinations
        - inherited
      properties:
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/PublicationDestinationChoice'
        inherited:
          type: boolean
          description: Whether this set comes from the app rather than being its own.
    PublicationChannel:
      type: object
      description: >-
        The safe identity behind a Discord destination. It names where
        announcements land and nothing that would let a reader send one.
      additionalProperties: false
      required:
        - guildId
        - channelId
        - webhookName
        - roleId
        - roleName
      properties:
        guildId:
          type: string
          description: The Discord server the channel belongs to.
        channelId:
          type: string
          description: The channel announcements land in.
        webhookName:
          type: string
          description: The name Discord shows the announcement under.
        roleId:
          type: string
          description: The one role an author may ask for, empty when there is none.
        roleName:
          type: string
          description: What that role is called, and all a contributor is shown.
    PublicationChannelRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 48
        address:
          type: string
          maxLength: 300
          description: >-
            The Discord incoming webhook address. Illarin masks it after
            saving; leave it out when changing a destination to keep the one it
            has.
        roleId:
          type: string
          maxLength: 20
          description: >-
            The one role an author may ask this destination to mention. Send it
            empty to approve no role.
        roleName:
          type: string
          maxLength: 48
          description: What that role is called, and all a contributor is shown.
    DestinationPolicyRequest:
      type: object
      additionalProperties: false
      properties:
        destinationIds:
          type: array
          nullable: true
          description: >-
            The destinations this policy allows. An absent list on a grant puts
            it back on its app's baseline; an empty list allows nothing.
          items:
            type: string
            format: uuid
        defaultDestinationIds:
          type: array
          description: Which of the allowed destinations a publication starts with.
          items:
            type: string
            format: uuid
