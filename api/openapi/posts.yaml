paths:
  /v1/publication/posts:
    get:
      operationId: listPosts
      description: >-
        Every post the signed-in account may manage. An admin sees all of them;
        an approved contributor sees only the posts under their active grant.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The posts this account may manage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
    post:
      operationId: createPost
      description: >-
        Start a draft. A contributor names the grant it belongs to; an admin may
        omit it and write as Illarin.
      security:
        - sessionCookie: []
          browserMutation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: The draft as it was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: A field is not valid or the grant does not cover the category
        '401':
          description: No account is signed in
        '403':
          description: The account may not publish under that identity
        '404':
          description: No such category or grant
  /v1/publication/posts/{id}:
    get:
      operationId: getPost
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The post's working copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: No account is signed in
        '403':
          description: The account may not manage that post
        '404':
          description: No such post
    put:
      operationId: savePost
      description: >-
        Replace the working copy. The request names the version it began from,
        and a stale version is refused rather than applied.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePostRequest'
      responses:
        '200':
          description: The working copy as it now reads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: A field or the post document is not valid
        '401':
          description: No account is signed in
        '403':
          description: The account may not manage that post
        '404':
          description: No such post
        '409':
          description: The working copy has already moved on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
  /v1/publication/posts/{id}/media:
    post:
      operationId: addPostMedia
      description: >-
        Upload one picture against this post. The record is immutable: replacing
        a picture uploads new bytes at a new address rather than changing an
        address readers already hold.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Send the metadata part before the image file part.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
                - file
              properties:
                metadata:
                  $ref: '#/components/schemas/AddPostMediaRequest'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: A new immutable post picture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMedia'
        '400':
          description: The purpose or the image is not valid
        '401':
          description: No account is signed in
        '403':
          description: The account may not manage that post
        '404':
          description: No such post
        '413':
          description: The image exceeds the upload limit
        '503':
          description: The storage reserve cannot accept the image
  /v1/publication/posts/{id}/revisions:
    get:
      operationId: listPostRevisions
      description: >-
        Every edition this post has kept, newest first. It names titles, times
        and keepers, and never compares two editions for a reader.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The editions this post has kept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostRevisionList'
        '401':
          description: No account is signed in
        '403':
          description: The account may not manage that post
        '404':
          description: No such post
    post:
      operationId: checkpointPost
      description: >-
        Keep the named working copy as an immutable edition. Readers see nothing
        new, and the working copy carries on unchanged.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVersionRequest'
      responses:
        '201':
          description: The edition that was kept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostRevision'
        '401':
          description: No account is signed in
        '403':
          description: The account may not manage that post
        '404':
          description: No such post
        '409':
          description: The working copy has already moved on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
  /v1/publication/posts/{id}/revisions/{revisionId}/restore:
    post:
      operationId: restorePostRevision
      description: >-
        Copy a kept edition into a new working copy. Every edition, and the one
        readers have, stay exactly as they were.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVersionRequest'
      responses:
        '200':
          description: The working copy the edition was copied into
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: No account is signed in
        '403':
          description: The account may not manage that post
        '404':
          description: No such post or edition of it
        '409':
          description: The working copy has already moved on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
  /v1/publication/posts/{id}/history:
    get:
      operationId: readPostHistory
      description: >-
        What has been done to this post, newest first. It carries actors,
        editions and times, and never a word anyone wrote.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: What has been done to this post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostActionList'
        '401':
          description: No account is signed in
        '403':
          description: The account may not manage that post
        '404':
          description: No such post
  /v1/publication/posts/{id}/publish:
    post:
      operationId: publishPost
      description: >-
        Capture the named working copy as an immutable revision and make that
        exact edition the public one.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVersionRequest'
      responses:
        '200':
          description: The post as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: A required field or the post document is not ready
        '401':
          description: No account is signed in
        '403':
          description: The account may not manage that post
        '404':
          description: No such post
        '409':
          description: The working copy has already moved on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConflict'
  /v1/publication/posts/{id}/address:
    put:
      operationId: correctPostAddress
      description: >-
        Move a published post to a corrected permalink. The address it leaves
        keeps pointing at the post and can never belong to another one.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectPostAddressRequest'
      responses:
        '200':
          description: The post at its corrected address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: The address is reserved, taken or the post is not published
        '401':
          description: No account is signed in
        '403':
          description: Only an Illarin admin may correct a published post
        '404':
          description: No such post
  /v1/publication/posts/{id}/byline:
    put:
      operationId: correctPostByline
      description: >-
        Replace the attribution a published post carries with a fresh snapshot
        of another account's public identity. The author, grant and captured
        revisions are unchanged.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectPostBylineRequest'
      responses:
        '200':
          description: The post carrying its corrected byline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: The post is not published
        '401':
          description: No account is signed in
        '403':
          description: Only an Illarin admin may correct a published post
        '404':
          description: No such post or account
  /v1/posts/{slug}:
    get:
      operationId: getPublishedPost
      description: >-
        The published edition behind one post address. Drafts and working copies
        are absent from it.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The published post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPost'
        '404':
          description: No published post has that address
components:
  schemas:
    PostStatus:
      type: string
      enum:
        - draft
        - published
    PostDocument:
      type: object
      description: >-
        The versioned structured body Illarin owns. Go validates its vocabulary
        for every client, and the site renders it directly.
      required:
        - version
        - content
      properties:
        version:
          type: integer
        content:
          type: array
          items:
            type: object
    PostMediaPurpose:
      type: string
      enum:
        - header
        - document
        - social
    PostMedia:
      type: object
      description: >-
        One picture a post owns. Its bytes never change, so an address a reader
        holds always answers with the picture the edition was written with.
      required:
        - id
        - postId
        - purpose
        - url
        - thumbUrl
        - width
        - height
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/PostMediaPurpose'
        url:
          type: string
          description: The size a picture is shown at on its own.
        thumbUrl:
          type: string
          description: The size a gallery shows a picture at.
        width:
          type: integer
        height:
          type: integer
    PostHeader:
      type: object
      required:
        - mediaId
        - alt
      properties:
        mediaId:
          type: string
          format: uuid
        alt:
          type: string
        caption:
          type: string
    PostHeaderEdit:
      type: object
      additionalProperties: false
      required:
        - mediaId
        - alt
      properties:
        mediaId:
          type: string
          format: uuid
        alt:
          type: string
        caption:
          type: string
    AddPostMediaRequest:
      type: object
      additionalProperties: false
      required:
        - purpose
      properties:
        purpose:
          $ref: '#/components/schemas/PostMediaPurpose'
    PostAuthor:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
    PostRelease:
      type: object
      required:
        - app
        - version
      properties:
        app:
          $ref: './publication.yaml#/components/schemas/PublicationApp'
        version:
          type: string
        address:
          type: string
    PostReleaseEdit:
      type: object
      additionalProperties: false
      required:
        - appId
        - version
      properties:
        appId:
          type: string
          format: uuid
        version:
          type: string
        address:
          type: string
    PostByline:
      type: object
      required:
        - handle
        - displayName
        - contactEmail
        - positions
        - distinctions
      properties:
        handle:
          type: string
        displayName:
          type: string
        contactEmail:
          type: string
        avatar:
          anyOf:
            - $ref: './accounts.yaml#/components/schemas/ProfileAvatar'
            - type: 'null'
        positions:
          type: array
          items:
            type: string
        distinctions:
          type: array
          items:
            type: string
        app:
          anyOf:
            - $ref: './publication.yaml#/components/schemas/PublicationApp'
            - type: 'null'
    Post:
      type: object
      required:
        - id
        - status
        - title
        - summary
        - slug
        - category
        - document
        - documentVersion
        - media
        - formerAddresses
        - version
        - author
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PostStatus'
        title:
          type: string
        summary:
          type: string
        slug:
          type: string
        category:
          $ref: './publication.yaml#/components/schemas/PublicationCategory'
        document:
          $ref: '#/components/schemas/PostDocument'
        documentVersion:
          type: integer
        release:
          anyOf:
            - $ref: '#/components/schemas/PostRelease'
            - type: 'null'
        header:
          anyOf:
            - $ref: '#/components/schemas/PostHeader'
            - type: 'null'
        socialMediaId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        publicRevisionId:
          description: The edition readers are being given, once there is one.
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        media:
          type: array
          items:
            $ref: '#/components/schemas/PostMedia'
        byline:
          anyOf:
            - $ref: '#/components/schemas/PostByline'
            - type: 'null'
        formerAddresses:
          type: array
          description: >-
            Addresses this post published under and has since left. Every one of
            them still reaches it.
          items:
            type: string
        app:
          anyOf:
            - $ref: './publication.yaml#/components/schemas/PublicationApp'
            - type: 'null'
        grantId:
          type: string
          format: uuid
        version:
          type: integer
        author:
          $ref: '#/components/schemas/PostAuthor'
        publishedAt:
          type: string
          format: date-time
        updatedPublicAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PostList:
      type: object
      required:
        - posts
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/Post'
    PostConflict:
      type: object
      required:
        - error
        - version
      properties:
        error:
          type: string
        field:
          type: string
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
    CreatePostRequest:
      type: object
      additionalProperties: false
      required:
        - categoryId
        - title
      properties:
        grantId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        title:
          type: string
    SavePostRequest:
      type: object
      additionalProperties: false
      required:
        - version
        - categoryId
        - title
        - summary
        - slug
        - document
      properties:
        version:
          type: integer
        categoryId:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        slug:
          type: string
        document:
          $ref: '#/components/schemas/PostDocument'
        release:
          anyOf:
            - $ref: '#/components/schemas/PostReleaseEdit'
            - type: 'null'
        header:
          anyOf:
            - $ref: '#/components/schemas/PostHeaderEdit'
            - type: 'null'
        socialMediaId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
    PostVersionRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          description: The working-copy version the action means to act on.
    PostRevisionReason:
      type: string
      description: Why an edition was kept.
      enum:
        - checkpoint
        - publication
    PostRevision:
      type: object
      description: >-
        One immutable edition of a post. It carries what the edition was called
        and when it was kept, not the words it holds.
      required:
        - id
        - number
        - title
        - summary
        - slug
        - category
        - capturedFor
        - capturedBy
        - capturedAt
        - public
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        title:
          type: string
        summary:
          type: string
        slug:
          type: string
        category:
          $ref: './publication.yaml#/components/schemas/PublicationCategory'
        capturedFor:
          $ref: '#/components/schemas/PostRevisionReason'
        capturedBy:
          type: string
        capturedAt:
          type: string
          format: date-time
        public:
          type: boolean
          description: Whether this is the edition readers are being given.
    PostRevisionList:
      type: object
      required:
        - revisions
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/PostRevision'
    PostAction:
      type: object
      description: >-
        One thing that was done to a post, named by who did it, what it was and
        which edition it touched.
      required:
        - id
        - actor
        - credential
        - action
        - at
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        credential:
          type: string
        action:
          type: string
        revision:
          anyOf:
            - type: integer
            - type: 'null'
        before:
          type: string
        after:
          type: string
        at:
          type: string
          format: date-time
    PostActionList:
      type: object
      required:
        - actions
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PostAction'
    CorrectPostAddressRequest:
      type: object
      additionalProperties: false
      required:
        - slug
      properties:
        slug:
          type: string
    CorrectPostBylineRequest:
      type: object
      additionalProperties: false
      required:
        - handle
      properties:
        handle:
          type: string
    PublicPost:
      type: object
      required:
        - id
        - slug
        - title
        - summary
        - category
        - document
        - media
        - byline
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        category:
          $ref: './publication.yaml#/components/schemas/PublicationCategory'
        document:
          $ref: '#/components/schemas/PostDocument'
        release:
          anyOf:
            - $ref: '#/components/schemas/PostRelease'
            - type: 'null'
        header:
          anyOf:
            - $ref: '#/components/schemas/PostHeader'
            - type: 'null'
        socialImage:
          anyOf:
            - $ref: '#/components/schemas/PostMedia'
            - type: 'null'
        media:
          type: array
          items:
            $ref: '#/components/schemas/PostMedia'
        byline:
          $ref: '#/components/schemas/PostByline'
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
