paths:
  /v1/publication/categories:
    get:
      operationId: listPublicationCategories
      description: >-
        Every publication category, retired ones included, in the order the
        publication authority chose. Only the publication authority may read it.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The publication categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationCategoryList'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
    put:
      operationId: orderPublicationCategories
      description: Put the categories in the order they are listed.
      security:
        - sessionCookie: []
          browserMutation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPublicationCategoriesRequest'
      responses:
        '200':
          description: The categories in their new order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationCategoryList'
        '400':
          description: The order does not name every category exactly once
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
  /v1/publication/categories/{id}:
    patch:
      operationId: updatePublicationCategory
      description: >-
        Change what a category is called and whether it is still current. Its
        slug is the stable identity posts and grants reference, so it does not
        change.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicationCategoryRequest'
      responses:
        '200':
          description: The category as it now reads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationCategory'
        '400':
          description: A category field is not valid
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such category
  /v1/publication/grants:
    get:
      operationId: listPublicationGrants
      description: >-
        Every grant ever made, revoked ones included. Only the publication
        authority may read it.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The publication grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationGrantList'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
    post:
      operationId: createPublicationGrant
      description: Approve one verified account to publish for one app.
      security:
        - sessionCookie: []
          browserMutation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationGrantRequest'
      responses:
        '201':
          description: The grant as it was made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationGrant'
        '400':
          description: The app, category set or default category is not usable
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such account
        '409':
          description: That account already publishes for that app
  /v1/publication/grants/{id}:
    patch:
      operationId: updatePublicationGrant
      description: Narrow or widen the categories one grant allows.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicationGrantRequest'
      responses:
        '200':
          description: The grant as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationGrant'
        '400':
          description: The category set or default category is not usable
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such grant
    delete:
      operationId: revokePublicationGrant
      description: >-
        End an approval. Editor access stops at once, while the grant record
        and everything already published stay.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The grant no longer permits publication
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account is not the publication authority
        '404':
          description: No such active grant
  /v1/publication/workspace:
    get:
      operationId: getPublicationWorkspace
      description: >-
        The apps, categories and defaults the signed-in account may publish
        under. An account with no active grant gets an empty workspace.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The signed-in account's publication workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationWorkspace'
        '401':
          description: No account is signed in
        '403':
          description: The signed-in account has not verified its email
components:
  schemas:
    PublicationApp:
      type: object
      required:
        - id
        - slug
        - name
        - home
        - position
        - retired
        - destinations
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        home:
          type: string
        position:
          type: integer
        retired:
          type: boolean
        destinations:
          type: array
          description: >-
            The destinations every grant on this app follows unless the grant
            names its own.
          items:
            $ref: './destinations.yaml#/components/schemas/PublicationDestinationChoice'
    PublicationAppList:
      type: object
      required:
        - apps
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/PublicationApp'
    PublicationCategory:
      type: object
      required:
        - id
        - slug
        - label
        - position
        - retired
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        label:
          type: string
        position:
          type: integer
        retired:
          type: boolean
    PublicationCategoryList:
      type: object
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PublicationCategory'
    UpdatePublicationCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        retired:
          type: boolean
    OrderPublicationCategoriesRequest:
      type: object
      additionalProperties: false
      required:
        - categoryIds
      properties:
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
    PublicationGrantHolder:
      type: object
      required:
        - handle
        - displayName
        - restricted
      properties:
        handle:
          type: string
        displayName:
          type: string
        avatar:
          anyOf:
            - $ref: './accounts.yaml#/components/schemas/ProfileAvatar'
            - type: 'null'
        restricted:
          type: boolean
    PublicationGrant:
      type: object
      required:
        - id
        - holder
        - app
        - categories
        - defaultCategory
        - grantedAt
        - active
        - destinations
        - destinationsInherited
      properties:
        id:
          type: string
          format: uuid
        holder:
          $ref: '#/components/schemas/PublicationGrantHolder'
        app:
          $ref: '#/components/schemas/PublicationApp'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PublicationCategory'
        defaultCategory:
          $ref: '#/components/schemas/PublicationCategory'
        destinations:
          type: array
          description: The destinations this contributor may send to.
          items:
            $ref: './destinations.yaml#/components/schemas/PublicationDestinationChoice'
        destinationsInherited:
          type: boolean
          description: Whether the set comes from the app rather than the grant itself.
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        active:
          type: boolean
    PublicationGrantList:
      type: object
      required:
        - grants
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/PublicationGrant'
    CreatePublicationGrantRequest:
      type: object
      additionalProperties: false
      required:
        - handle
        - appId
        - categoryIds
        - defaultCategoryId
      properties:
        handle:
          type: string
        appId:
          type: string
          format: uuid
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        defaultCategoryId:
          type: string
          format: uuid
    UpdatePublicationGrantRequest:
      type: object
      additionalProperties: false
      properties:
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        defaultCategoryId:
          type: string
          format: uuid
    PublicationWorkspace:
      type: object
      required:
        - handle
        - admin
        - grants
        - categories
        - apps
      properties:
        handle:
          type: string
        admin:
          type: boolean
        grants:
          type: array
          items:
            $ref: '#/components/schemas/PublicationGrant'
        categories:
          description: >-
            The categories this account may start a post in. A contributor gets
            what their grants allow; an admin gets every live category.
          type: array
          items:
            $ref: '#/components/schemas/PublicationCategory'
        apps:
          description: >-
            The projects this account may name in a release. A contributor gets
            the apps they are approved for; an admin gets every live app.
          type: array
          items:
            $ref: '#/components/schemas/PublicationApp'
    PublicationErrorCode:
      type: string
      description: >-
        The stable name of a refusal. A client reads this rather than the
        sentence beside it, which is written for a person and may change.
      enum:
        - unauthenticated
        - forbidden
        - not_found
        - invalid
        - category_refused
        - stale_version
        - already_scheduled
        - schedule_running
        - server_error
      x-enum-varnames:
        - CodeUnauthenticated
        - CodeForbidden
        - CodeNotFound
        - CodeInvalid
        - CodeCategoryRefused
        - CodeStaleVersion
        - CodeAlreadyScheduled
        - CodeScheduleRunning
        - CodeServerError
    PublicationError:
      type: object
      description: >-
        How every publication route refuses. It never names another account or
        grant.
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          $ref: '#/components/schemas/PublicationErrorCode'
        field:
          type: string
          description: The request field the refusal is about, where there is one.
  responses:
    PublicationInvalid:
      description: A field, the post document or the request itself is not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationError'
    PublicationUnauthenticated:
      description: The request carries no live credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationError'
    PublicationForbidden:
      description: The credential may not reach that
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationError'
    PublicationNotFound:
      description: Nothing this credential may reach has that identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationError'