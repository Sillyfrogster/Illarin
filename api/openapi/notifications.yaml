paths:
  /v1/notifications:
    get:
      operationId: listNotifications
      description: >-
        The signed-in account's notifications, newest first. Send the cursor
        from the previous page to read the next one.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: before
          in: query
          description: >-
            When the last notification on the previous page arrived. Send it
            with beforeId or not at all.
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          description: The id of that same notification
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of the inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '400':
          description: The limit is out of range, or only half a cursor was sent
        '401':
          description: No account is signed in
  /v1/notifications/unread:
    get:
      operationId: countUnreadNotifications
      description: How many notifications the signed-in account has not opened.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadNotifications'
        '401':
          description: No account is signed in
  /v1/notifications/read:
    post:
      operationId: markAllNotificationsRead
      description: Mark every notification the signed-in account has as read.
      security:
        - sessionCookie: []
          browserMutation: []
      responses:
        '204':
          description: Every notification is read
        '401':
          description: No account is signed in
  /v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      description: Mark one of the signed-in account's notifications as read.
      security:
        - sessionCookie: []
          browserMutation: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The notification is read
        '401':
          description: No account is signed in
        '404':
          description: The signed-in account has no such notification
  /v1/assets/{id}/watch:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: watchAsset
      description: >-
        Watch an asset, so the signed-in account hears when it is updated. An
        unlisted asset can be watched, because its address is enough to read
        it. A draft cannot, and neither can the account's own asset.
      security:
        - sessionCookie: []
          browserMutation: []
      responses:
        '200':
          description: The account's watch on the asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetWatch'
        '401':
          description: No account is signed in
        '403':
          description: The browser proof is invalid, or the account owns the asset
        '404':
          description: No published asset has that id
    delete:
      operationId: stopWatchingAsset
      description: >-
        Stop watching an asset. The watch stays stopped, even while one of the
        account's linked instances has the asset installed, until the account
        watches it again.
      security:
        - sessionCookie: []
          browserMutation: []
      responses:
        '200':
          description: The account's watch on the asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetWatch'
        '401':
          description: No account is signed in
        '403':
          description: The browser proof is invalid, or the account owns the asset
        '404':
          description: No published asset has that id
components:
  schemas:
    AssetWatch:
      type: object
      description: >-
        Whether the signed-in account hears about an asset's updates, and why.
        The asset page returns it only to a signed-in reader who does not own
        the asset. A watch records nothing about how it was made.
      required:
        - state
        - installedOn
      properties:
        state:
          type: string
          description: >-
            none when the account has not watched the asset and none of its
            linked instances has it installed. watching when the account chose
            to watch it. installed when the account made no choice and one of
            its linked instances reports having it installed. stopped when the
            account stopped watching it, which holds through later installs.
          enum:
            - none
            - watching
            - installed
            - stopped
        installedOn:
          type: array
          description: >-
            The names of the account's linked instances that report having the
            asset installed, whatever the state.
          items:
            type: string
    NotificationType:
      type: string
      description: >-
        asset_withheld and asset_restored say that Illarin staff withheld or
        restored one of the account's assets. asset_updated says that an asset
        the account watches, or has installed on a linked instance, published
        an update that changed its file. profile_restricted and
        profile_restored say that Illarin staff restricted or restored the
        account's public profile.
      enum:
        - asset_withheld
        - asset_restored
        - asset_updated
        - profile_restricted
        - profile_restored
    NotificationAsset:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The asset's name when the notification arrived
    NotificationUpdate:
      type: object
      description: The update an asset_updated notification is about, as it read when it was published.
      required:
        - number
        - summary
      properties:
        number:
          type: integer
          description: The update's number in the asset's history
        versionLabel:
          type: string
          description: The creator's own version text, absent when they wrote none
        summary:
          type: string
          description: The creator's short line saying what changed
    Notification:
      type: object
      description: >-
        One notification in the signed-in account's inbox. Its words are kept
        as they read when it arrived, so a later rename does not change them.
      required:
        - id
        - type
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        createdAt:
          type: string
          format: date-time
          description: When the change it describes happened
        readAt:
          type: string
          format: date-time
          description: When the account opened it. Absent while it is unread.
        asset:
          $ref: '#/components/schemas/NotificationAsset'
        reason:
          type: string
          description: >-
            Why staff withheld the asset or restricted the profile. Present on
            asset_withheld and profile_restricted.
        update:
          $ref: '#/components/schemas/NotificationUpdate'
    NotificationCursor:
      type: object
      required:
        - before
        - beforeId
      properties:
        before:
          type: string
          format: date-time
        beforeId:
          type: string
          format: uuid
    NotificationList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          $ref: '#/components/schemas/NotificationCursor'
    UnreadNotifications:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 0
