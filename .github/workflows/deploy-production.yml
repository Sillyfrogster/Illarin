name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    name: Deploy verified images to the production host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_HOST_KEYS: ${{ secrets.PRODUCTION_HOST_KEYS }}
      PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      PRODUCTION_ENV_FILE: ${{ vars.PRODUCTION_ENV_FILE || '/etc/illarin/production.env' }}
      PRODUCTION_ROOT: ${{ vars.PRODUCTION_ROOT || '/opt/illarin' }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the selected default-branch commit
        uses: actions/checkout@v7

      - name: Prepare the production SSH identity
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_HOST_KEYS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Package the production control files
        run: make release-package VERSION="$GITHUB_SHA" OUTPUT=illarin-release.tar.gz

      - name: Copy the control files to the production host
        run: |
          set -euo pipefail
          scp -P "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            illarin-release.tar.gz \
            "$PRODUCTION_USER@$PRODUCTION_HOST:/tmp/illarin-${GITHUB_SHA}.tar.gz"

      - name: Deploy the selected default-branch commit
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"
          printf -v deploy_command '%q ' bash -s -- "$GITHUB_SHA" "$PRODUCTION_ROOT" "$PRODUCTION_ENV_FILE"
          ssh -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "$deploy_command" <<'REMOTE'
          set -euo pipefail
          version="$1"
          release_root="$2"
          production_env_file="$3"
          case "$release_root" in /*) ;; *) echo "PRODUCTION_ROOT must be an absolute path." >&2; exit 1 ;; esac
          case "$production_env_file" in /*) ;; *) echo "PRODUCTION_ENV_FILE must be an absolute path." >&2; exit 1 ;; esac
          test -r "$production_env_file"
          release="$release_root/releases/$version"
          mkdir -p "$release"
          tar -xzf "/tmp/illarin-$version.tar.gz" -C "$release"
          make -C "$release" prod-deploy VERSION="$version" PROD_ENV="$production_env_file"
          ln -sfn "$release" "$release_root/current"
          rm "/tmp/illarin-$version.tar.gz"
          REMOTE
