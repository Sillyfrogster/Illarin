name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: api/go.sum

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: make format-check

      - name: Vet the Go code
        if: ${{ !cancelled() }}
        run: make vet

      - name: Check the workflows
        if: ${{ !cancelled() }}
        run: make workflow-check

      - name: Run the Go tests
        id: tests
        if: ${{ !cancelled() }}
        run: make test TEST_JSON="$RUNNER_TEMP/go-test.json"

      - name: Summarize the Go tests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: robherley/go-test-action@v1
        with:
          fromJSONFile: ${{ runner.temp }}/go-test.json
          omit: |
            untested
            pie

  web:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: api/go.sum

      - name: Install locked web dependencies
        run: make web-install

      - name: Run the site tests
        if: ${{ !cancelled() }}
        run: make test-web

      - name: Lint and type-check the site
        if: ${{ !cancelled() }}
        run: make lint

  images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            dockerfile: api/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ILLARIN_VERSION=${{ github.sha }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
